<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">

        <div class="header">
            <h1>User Management</h1>
            <div class="header-right">
                <span id="userDisplay"></span>
                <span id="roleDisplay" class="text-muted"></span>
                <a href="search.html">Search</a>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="alert" class="alert"></div>

        <!-- MY PROFILE -->
        <div class="section-box">
            <h2>My Profile</h2>
            <form id="profileForm" onsubmit="updateProfile(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="editFirstName" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="editLastName" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="editEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <input type="text" id="editDepartment" list="deptList" required>
                        <datalist id="deptList">
                            <option value="Pharmacy">
                            <option value="Ward A">
                            <option value="Ward B">
                            <option value="Ward C">
                            <option value="Outpatient">
                            <option value="Emergency">
                            <option value="Surgical">
                            <option value="Maternity">
                            <option value="Paediatric">
                            <option value="Private">
                            <option value="Administration">
                            <option value="Other">
                        </datalist>
                    </div>
                </div>
                <div class="form-group">
                    <label>Username (cannot be changed)</label>
                    <input type="text" id="editUsername" disabled>
                </div>
                <div class="form-group">
                    <label>New Password (leave blank to keep current)</label>
                    <input type="password" id="editPassword" placeholder="Min 6 characters">
                </div>
                <button type="submit" class="btn">Update Profile</button>
            </form>
        </div>

        <!-- ADMIN SECTION -->
        <div id="adminSection" style="display:none;" class="section-box">
            <h2>Manage Users (Admin)</h2>
            <div class="flex flex-wrap gap-10 mb-10">
                <button class="btn" onclick="loadAllUsers()">Refresh Users</button>
                <button class="btn" onclick="deleteAllUsers()">Delete All Users</button>
            </div>
            <div id="usersContainer">
                <p class="text-muted">Loading users...</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
    <script>
        var currentUser = {};

        function initUsers() {
            if (!checkAuth()) return;

            currentUser = getCurrentUser();

            document.getElementById('userDisplay').textContent = 'Welcome, ' + currentUser.fullName;
            document.getElementById('roleDisplay').textContent = currentUser.isAdmin ? '(Admin)' : '(User)';

            document.getElementById('editUsername').value = currentUser.username;
            document.getElementById('editFirstName').value = currentUser.firstName;
            document.getElementById('editLastName').value = currentUser.lastName;
            document.getElementById('editEmail').value = currentUser.email;
            document.getElementById('editDepartment').value = currentUser.department;

            if (currentUser.isAdmin) {
                document.getElementById('adminSection').style.display = 'block';
                loadAllUsers();
            }
        }

        async function updateProfile(event) {
            event.preventDefault();

            var firstName = document.getElementById('editFirstName').value.trim();
            var lastName = document.getElementById('editLastName').value.trim();
            var email = document.getElementById('editEmail').value.trim();
            var department = document.getElementById('editDepartment').value.trim();
            var password = document.getElementById('editPassword').value.trim();
            var username = localStorage.getItem('username');

            if (!firstName || !lastName || !email || !department) {
                showAlert('All fields except password are required.', 'error');
                return;
            }

            if (password && password.length < 6) {
                showAlert('Password must be at least 6 characters.', 'error');
                return;
            }

            try {
                var url = API_URL +
                    '?action=updateprofile' +
                    '&username=' + encodeURIComponent(username) +
                    '&firstName=' + encodeURIComponent(firstName) +
                    '&lastName=' + encodeURIComponent(lastName) +
                    '&email=' + encodeURIComponent(email) +
                    '&department=' + encodeURIComponent(department);

                if (password) {
                    url += '&password=' + encodeURIComponent(password);
                }

                var response = await fetch(url);
                var result = await response.json();

                if (result.success) {
                    localStorage.setItem('fullName', firstName + ' ' + lastName);
                    localStorage.setItem('firstName', firstName);
                    localStorage.setItem('lastName', lastName);
                    localStorage.setItem('email', email);
                    localStorage.setItem('department', department);

                    showAlert('Profile updated successfully!', 'success');
                    document.getElementById('editPassword').value = '';
                    document.getElementById('userDisplay').textContent = 'Welcome, ' + firstName + ' ' + lastName;

                    if (currentUser.isAdmin) {
                        loadAllUsers();
                    }
                } else {
                    showAlert(result.message || 'Error updating profile.', 'error');
                }

            } catch (error) {
                console.error('Update error:', error);
                showAlert('Error connecting to server.', 'error');
            }
        }

        async function loadAllUsers() {
            var container = document.getElementById('usersContainer');
            container.innerHTML = '<p class="text-muted">Loading...</p>';

            var adminUsername = localStorage.getItem('username');

            try {
                var response = await fetch(API_URL +
                    '?action=getusers&adminUsername=' + encodeURIComponent(adminUsername));
                var results = await response.json();

                if (!results.success && results.message) {
                    container.innerHTML = '<p>' + results.message + '</p>';
                    return;
                }

                if (results.length === 0) {
                    container.innerHTML = '<p class="text-muted">No users found.</p>';
                    return;
                }

                var html = '<table><tr><th>Username</th><th>Email</th><th>First Name</th><th>Last Name</th><th>Department</th><th>Created</th><th>Actions</th></tr>';

                results.forEach(function(user) {
                    var date = user.created ? new Date(user.created).toLocaleDateString() : 'Unknown';

                    html += '<tr>';
                    html += '<td>' + user.username + '</td>';
                    html += '<td>' + user.email + '</td>';
                    html += '<td>' + user.firstName + '</td>';
                    html += '<td>' + user.lastName + '</td>';
                    html += '<td>' + user.department + '</td>';
                    html += '<td>' + date + '</td>';
                    html += '<td>';
                    if (user.username === 'admin') {
                        html += '<span class="text-muted">Protected</span>';
                    } else {
                        html += '<button class="btn btn-small" onclick="adminEditUser(\'' + user.username + '\')">Edit</button>';
                        html += ' <button class="btn btn-small" onclick="adminDeleteUser(\'' + user.username + '\')">Delete</button>';
                    }
                    html += '</td>';
                    html += '</tr>';
                });

                html += '</table>';
                container.innerHTML = html;

            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = '<p>Error loading users.</p>';
            }
        }

        function adminEditUser(username) {
            var newFirstName = prompt('Enter new first name for ' + username + ':');
            if (newFirstName === null) return;
            var newLastName = prompt('Enter new last name for ' + username + ':');
            if (newLastName === null) return;
            var newEmail = prompt('Enter new email for ' + username + ':');
            if (newEmail === null) return;
            var newDepartment = prompt('Enter new department for ' + username + ':');
            if (newDepartment === null) return;

            adminUpdateUser(username, newFirstName.trim(), newLastName.trim(), newEmail.trim(), newDepartment.trim());
        }

        async function adminUpdateUser(username, firstName, lastName, email, department) {
            if (!firstName || !lastName || !email || !department) {
                showAlert('All fields are required.', 'error');
                return;
            }

            var adminUsername = localStorage.getItem('username');

            try {
                var response = await fetch(API_URL +
                    '?action=adminupdateuser' +
                    '&targetUsername=' + encodeURIComponent(username) +
                    '&adminUsername=' + encodeURIComponent(adminUsername) +
                    '&firstName=' + encodeURIComponent(firstName) +
                    '&lastName=' + encodeURIComponent(lastName) +
                    '&email=' + encodeURIComponent(email) +
                    '&department=' + encodeURIComponent(department));

                var result = await response.json();

                if (result.success) {
                    showAlert('User updated successfully!', 'success');
                    loadAllUsers();
                } else {
                    showAlert(result.message || 'Error updating user.', 'error');
                }

            } catch (error) {
                console.error('Error:', error);
                showAlert('Error connecting to server.', 'error');
            }
        }

        async function adminDeleteUser(username) {
            if (!confirm('Delete user "' + username + '"? This cannot be undone.')) {
                return;
            }

            var adminUsername = localStorage.getItem('username');

            try {
                var response = await fetch(API_URL +
                    '?action=deleteuser' +
                    '&username=' + encodeURIComponent(username) +
                    '&adminUsername=' + encodeURIComponent(adminUsername));

                var result = await response.json();

                if (result.success) {
                    showAlert(result.message, 'success');
                    loadAllUsers();
                } else {
                    showAlert(result.message || 'Error deleting user.', 'error');
                }

            } catch (error) {
                console.error('Error:', error);
                showAlert('Error connecting to server.', 'error');
            }
        }

        async function deleteAllUsers() {
            if (!confirm('Delete ALL non-admin users? This cannot be undone.')) {
                return;
            }

            if (!confirm('Are you absolutely sure? All user accounts (except admin) will be deleted.')) {
                return;
            }

            var adminUsername = localStorage.getItem('username');

            try {
                var response = await fetch(API_URL +
                    '?action=deleteallusers&adminUsername=' + encodeURIComponent(adminUsername));

                var result = await response.json();

                if (result.success) {
                    showAlert(result.message, 'success');
                    loadAllUsers();
                } else {
                    showAlert(result.message || 'Error deleting users.', 'error');
                }

            } catch (error) {
                console.error('Error:', error);
                showAlert('Error connecting to server.', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initUsers();

            setupEnterNavigation(
                document.getElementById('profileForm'),
                ['editFirstName', 'editLastName', 'editEmail', 'editDepartment', 'editPassword']
            );
        });
    </script>

</body>
</html>
