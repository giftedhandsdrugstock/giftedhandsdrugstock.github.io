<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">

        <div class="header">
            <h1>User Management</h1>
            <div class="header-right">
                <span id="userDisplay"></span>
                <span id="roleDisplay" class="text-muted"></span>
                <a href="search.html">Search</a>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="alert" class="alert"></div>

        <!-- SEARCH SECTION -->
        <div class="section-box">
            <div class="flex flex-wrap gap-10" style="align-items:center;">
                <div style="flex:1;min-width:200px;">
                    <input type="text" id="userSearch" placeholder="Search users..." style="width:100%;padding:6px 8px;border:1px solid #ccc;">
                </div>
                <div style="display:flex;gap:10px;align-items:center;">
                    <label><input type="checkbox" id="searchName" checked> Name</label>
                    <label><input type="checkbox" id="searchEmail" checked> Email</label>
                    <label><input type="checkbox" id="searchDept" checked> Department</label>
                    <label><input type="checkbox" id="searchUsername" checked> Username</label>
                </div>
                <button class="btn" onclick="searchUsers()">Search</button>
                <button class="btn" onclick="loadAllUsers()">Show All</button>
            </div>
        </div>

        <!-- USER LIST -->
        <div class="section-box">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
                <h2>Users</h2>
                <div style="display:flex;gap:10px;">
                    <button class="btn" onclick="saveAllUsers()">Save All Changes</button>
                    <button class="btn" onclick="deleteAllUsers()" style="color:#c00;">Delete All Users</button>
                </div>
            </div>
            <div id="usersContainer">
                <p class="text-muted">Loading users...</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
    <script>
        // ============================================================
        // USERS.HTML SPECIFIC
        // ============================================================

        var allUsers = [];
        var originalUsers = [];
        var currentUser = {};

        function initUsers() {
            if (!checkAuth()) return;

            currentUser = getCurrentUser();

            document.getElementById('userDisplay').textContent = 'Welcome, ' + currentUser.fullName;
            document.getElementById('roleDisplay').textContent = currentUser.isAdmin ? '(Admin)' : '(User)';

            if (!currentUser.isAdmin) {
                document.getElementById('usersContainer').innerHTML = '<p>Admin access required.</p>';
                return;
            }

            loadAllUsers();
        }

        async function loadAllUsers() {
            var container = document.getElementById('usersContainer');
            container.innerHTML = '<p class="text-muted">Loading...</p>';

            try {
                var response = await fetch(API_URL +
                    '?action=getusers&adminUsername=' + encodeURIComponent('admin'));
                var results = await response.json();

                if (!results.success && results.message) {
                    container.innerHTML = '<p>' + results.message + '</p>';
                    return;
                }

                allUsers = results;
                originalUsers = JSON.parse(JSON.stringify(results));
                renderUsers(allUsers);

            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = '<p>Error loading users.</p>';
            }
        }

        function renderUsers(users) {
            var container = document.getElementById('usersContainer');

            if (users.length === 0) {
                container.innerHTML = '<p class="text-muted">No users found.</p>';
                return;
            }

            var html = '<table>';
            html += '<tr>';
            html += '<th>Username</th>';
            html += '<th>First Name</th>';
            html += '<th>Last Name</th>';
            html += '<th>Email</th>';
            html += '<th>Department</th>';
            html += '<th>Actions</th>';
            html += '</tr>';

            users.forEach(function(user, index) {
                var isAdmin = user.username === 'admin';
                var isProtected = isAdmin;

                html += '<tr id="user-row-' + index + '">';
                html += '<td><strong>' + user.username + '</strong></td>';

                // First Name (editable)
                html += '<td>';
                if (isProtected) {
                    html += user.firstName;
                } else {
                    html += '<input type="text" id="fn-' + index + '" value="' + escapeHtml(user.firstName) + '" style="width:100%;padding:4px 6px;border:1px solid #ccc;">';
                }
                html += '</td>';

                // Last Name (editable)
                html += '<td>';
                if (isProtected) {
                    html += user.lastName;
                } else {
                    html += '<input type="text" id="ln-' + index + '" value="' + escapeHtml(user.lastName) + '" style="width:100%;padding:4px 6px;border:1px solid #ccc;">';
                }
                html += '</td>';

                // Email (editable)
                html += '<td>';
                if (isProtected) {
                    html += user.email;
                } else {
                    html += '<input type="email" id="em-' + index + '" value="' + escapeHtml(user.email) + '" style="width:100%;padding:4px 6px;border:1px solid #ccc;">';
                }
                html += '</td>';

                // Department (editable)
                html += '<td>';
                if (isProtected) {
                    html += user.department;
                } else {
                    html += '<input type="text" id="dp-' + index + '" value="' + escapeHtml(user.department) + '" style="width:100%;padding:4px 6px;border:1px solid #ccc;">';
                }
                html += '</td>';

                // Actions
                html += '<td>';
                if (isProtected) {
                    html += '<span class="text-muted">Protected</span>';
                } else {
                    html += '<button class="btn btn-small" onclick="saveUser(' + index + ')">💾 Save</button>';
                    html += ' <button class="btn btn-small" onclick="deleteUser(\'' + user.username + '\')" style="color:#c00;">✕</button>';
                }
                html += '</td>';

                html += '</tr>';
            });

            html += '</table>';
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ============================================================
        // SEARCH USERS
        // ============================================================

        function searchUsers() {
            var query = document.getElementById('userSearch').value.toLowerCase().trim();
            var searchName = document.getElementById('searchName').checked;
            var searchEmail = document.getElementById('searchEmail').checked;
            var searchDept = document.getElementById('searchDept').checked;
            var searchUsername = document.getElementById('searchUsername').checked;

            if (!query) {
                renderUsers(allUsers);
                return;
            }

            var filtered = allUsers.filter(function(user) {
                var match = false;
                if (searchName && (user.firstName.toLowerCase().indexOf(query) !== -1 || user.lastName.toLowerCase().indexOf(query) !== -1)) match = true;
                if (searchEmail && user.email.toLowerCase().indexOf(query) !== -1) match = true;
                if (searchDept && user.department.toLowerCase().indexOf(query) !== -1) match = true;
                if (searchUsername && user.username.toLowerCase().indexOf(query) !== -1) match = true;
                return match;
            });

            renderUsers(filtered);
        }

        // ============================================================
        // SAVE SINGLE USER
        // ============================================================

        function saveUser(index) {
            var user = allUsers[index];
            if (!user || user.username === 'admin') return;

            var firstName = document.getElementById('fn-' + index).value.trim();
            var lastName = document.getElementById('ln-' + index).value.trim();
            var email = document.getElementById('em-' + index).value.trim();
            var department = document.getElementById('dp-' + index).value.trim();

            if (!firstName || !lastName || !email || !department) {
                showAlert('All fields are required.', 'error');
                return;
            }

            adminUpdateUser(user.username, firstName, lastName, email, department);
        }

        async function adminUpdateUser(username, firstName, lastName, email, department) {
            try {
                var response = await fetch(API_URL +
                    '?action=adminupdateuser' +
                    '&adminUsername=' + encodeURIComponent('admin') +
                    '&targetUsername=' + encodeURIComponent(username) +
                    '&firstName=' + encodeURIComponent(firstName) +
                    '&lastName=' + encodeURIComponent(lastName) +
                    '&email=' + encodeURIComponent(email) +
                    '&department=' + encodeURIComponent(department));

                var result = await response.json();

                if (result.success) {
                    showAlert('User ' + username + ' updated successfully!', 'success');
                    loadAllUsers();
                } else {
                    showAlert(result.message || 'Error updating user.', 'error');
                }

            } catch (error) {
                console.error('Error:', error);
                showAlert('Error connecting to server.', 'error');
            }
        }

        // ============================================================
        // SAVE ALL USERS
        // ============================================================

        function saveAllUsers() {
            var allInputs = document.querySelectorAll('#usersContainer input');
            if (allInputs.length === 0) {
                showAlert('No editable users found.', 'info');
                return;
            }

            if (!confirm('Save all changes for all users?')) return;

            var promises = [];
            var usersToUpdate = [];

            allUsers.forEach(function(user, index) {
                if (user.username === 'admin') return;

                var firstName = document.getElementById('fn-' + index).value.trim();
                var lastName = document.getElementById('ln-' + index).value.trim();
                var email = document.getElementById('em-' + index).value.trim();
                var department = document.getElementById('dp-' + index).value.trim();

                if (!firstName || !lastName || !email || !department) {
                    showAlert('All fields are required for ' + user.username, 'error');
                    return;
                }

                usersToUpdate.push({
                    username: user.username,
                    firstName: firstName,
                    lastName: lastName,
                    email: email,
                    department: department
                });
            });

            if (usersToUpdate.length === 0) {
                showAlert('No changes to save.', 'info');
                return;
            }

            var completed = 0;
            var errors = [];

            usersToUpdate.forEach(function(user) {
                fetch(API_URL +
                    '?action=adminupdateuser' +
                    '&adminUsername=' + encodeURIComponent('admin') +
                    '&targetUsername=' + encodeURIComponent(user.username) +
                    '&firstName=' + encodeURIComponent(user.firstName) +
                    '&lastName=' + encodeURIComponent(user.lastName) +
                    '&email=' + encodeURIComponent(user.email) +
                    '&department=' + encodeURIComponent(user.department))
                .then(function(response) { return response.json(); })
                .then(function(result) {
                    completed++;
                    if (!result.success) {
                        errors.push(user.username + ': ' + result.message);
                    }
                    if (completed === usersToUpdate.length) {
                        if (errors.length === 0) {
                            showAlert('All users updated successfully!', 'success');
                        } else {
                            showAlert('Some errors occurred:\n' + errors.join('\n'), 'error');
                        }
                        loadAllUsers();
                    }
                })
                .catch(function(error) {
                    completed++;
                    errors.push(user.username + ': ' + error.message);
                    if (completed === usersToUpdate.length) {
                        showAlert('Some errors occurred:\n' + errors.join('\n'), 'error');
                        loadAllUsers();
                    }
                });
            });
        }

        // ============================================================
        // DELETE USER
        // ============================================================

        function deleteUser(username) {
            if (!confirm('Delete user "' + username + '"? This cannot be undone.')) {
                return;
            }

            fetch(API_URL +
                '?action=deleteuser' +
                '&username=' + encodeURIComponent(username) +
                '&adminUsername=' + encodeURIComponent('admin'))
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (result.success) {
                    showAlert(result.message, 'success');
                    loadAllUsers();
                } else {
                    showAlert(result.message || 'Error deleting user.', 'error');
                }
            })
            .catch(function(error) {
                console.error('Error:', error);
                showAlert('Error connecting to server.', 'error');
            });
        }

        // ============================================================
        // DELETE ALL USERS
        // ============================================================

        function deleteAllUsers() {
            if (!confirm('Delete ALL non-admin users? This cannot be undone.')) {
                return;
            }

            if (!confirm('Are you absolutely sure? All user accounts (except admin) will be deleted.')) {
                return;
            }

            fetch(API_URL +
                '?action=deleteallusers&adminUsername=' + encodeURIComponent('admin'))
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (result.success) {
                    showAlert(result.message, 'success');
                    loadAllUsers();
                } else {
                    showAlert(result.message || 'Error deleting users.', 'error');
                }
            })
            .catch(function(error) {
                console.error('Error:', error);
                showAlert('Error connecting to server.', 'error');
            });
        }

        // ============================================================
        // ENTER KEY FOR SEARCH
        // ============================================================

        document.addEventListener('DOMContentLoaded', function() {
            initUsers();

            document.getElementById('userSearch').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    searchUsers();
                }
            });
        });
    </script>

</body>
</html>
