<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER PLACEHOLDER -->
    <div id="header"></div>

    <!-- ===== PAGE CONTENT ===== -->
    <!-- SEARCH SECTION -->
    <div class="section-box">
        <div class="flex flex-wrap gap-10" style="align-items:center;">
            <div style="flex:1;min-width:200px;">
                <input type="text" id="userSearch" placeholder="Search by ID, Name, Email or Department..." style="width:100%;padding:6px 8px;border:1px solid #ccc;">
            </div>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                <label><input type="checkbox" id="searchId" checked> User ID</label>
                <label><input type="checkbox" id="searchName" checked> Name</label>
                <label><input type="checkbox" id="searchEmail" checked> Email</label>
                <label><input type="checkbox" id="searchDept" checked> Department</label>
                <label><input type="checkbox" id="searchUsername" checked> Username</label>
            </div>
            <button class="btn" onclick="searchUsers()">Search</button>
            <button class="btn" onclick="clearSearchBar()">Clear</button>
            <button class="btn" onclick="showAllUsers()">Show All Users</button>
        </div>
    </div>

    <!-- USER LIST -->
    <div id="userListSection" class="section-box" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
            <h2>Users</h2>
            <div style="display:flex;gap:10px;align-items:center;">
                <span id="resultCount" class="text-muted"></span>
                <button class="btn" onclick="saveAllUsers()">Save All Changes</button>
                <button class="btn" onclick="deleteAllUsers()" style="color:#c00;">Delete All Users</button>
                <button class="btn" onclick="closeUserList()" style="color:#c00;font-weight:bold;">✕ Close</button>
            </div>
        </div>
        <div id="usersContainer">
            <p class="text-muted">No users found.</p>
        </div>
    </div>

    <!-- FOOTER PLACEHOLDER -->
    <div id="footer"></div>

    <script>
        // ============================================================
        // LOAD HEADER AND FOOTER, THEN INITIALIZE
        // ============================================================

        var headerLoaded = false;
        var footerLoaded = false;

        function checkReady() {
            if (headerLoaded && footerLoaded) {
                var script = document.createElement('script');
                script.src = 'script.js';
                script.onload = function() {
                    if (typeof initPage === 'function') {
                        initPage();
                    }
                };
                document.body.appendChild(script);
            }
        }

        fetch('header.html')
            .then(function(response) { return response.text(); })
            .then(function(html) {
                document.getElementById('header').innerHTML = html;
                headerLoaded = true;
                checkReady();
            })
            .catch(function(error) {
                console.error('Error loading header:', error);
                headerLoaded = true;
                checkReady();
            });

        fetch('footer.html')
            .then(function(response) { return response.text(); })
            .then(function(html) {
                document.getElementById('footer').innerHTML = html;
                footerLoaded = true;
                checkReady();
            })
            .catch(function(error) {
                console.error('Error loading footer:', error);
                footerLoaded = true;
                checkReady();
            });

        // ============================================================
        // USERS.HTML SPECIFIC
        // ============================================================

        var allUsers = [];
        var filteredUsers = [];
        var currentUser = {};
        var isShowingAll = false;

        function initPage() {
            if (!checkAuth()) return;

            currentUser = getCurrentUser();
            var userDisplay = document.getElementById('userDisplay');
            if (userDisplay) userDisplay.textContent = 'Welcome, ' + currentUser.fullName;

            var roleDisplay = document.getElementById('roleDisplay');
            if (roleDisplay) roleDisplay.textContent = currentUser.isAdmin ? '(Admin)' : '(User)';

            if (typeof initNav === 'function') initNav();

            if (!currentUser.isAdmin) {
                var container = document.getElementById('usersContainer');
                if (container) container.innerHTML = '<p>Admin access required.</p>';
                var section = document.getElementById('userListSection');
                if (section) section.style.display = 'block';
                return;
            }

            if (typeof showLoading === 'function') showLoading('Loading users...');
            loadAllUsers();

            // Set up search enter key
            var userSearch = document.getElementById('userSearch');
            if (userSearch) {
                userSearch.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        searchUsers();
                    }
                });
            }
        }

        async function loadAllUsers() {
            try {
                var response = await fetch(API_URL +
                    '?action=getusers&adminUsername=' + encodeURIComponent('admin'));
                var results = await response.json();

                if (typeof hideLoading === 'function') hideLoading();

                if (!results.success && results.message) {
                    allUsers = [];
                    return;
                }

                allUsers = results;

            } catch (error) {
                if (typeof hideLoading === 'function') hideLoading();
                console.error('Error:', error);
                allUsers = [];
            }
        }

        function renderUsers(users) {
            var container = document.getElementById('usersContainer');
            var section = document.getElementById('userListSection');
            var count = document.getElementById('resultCount');

            if (!container) return;

            if (users.length === 0) {
                container.innerHTML = '<p class="text-muted">No users found matching your search.</p>';
                if (count) count.textContent = '0 users found';
                if (section) section.style.display = 'block';
                return;
            }

            if (count) count.textContent = users.length + ' user(s) found';

            var html = '<table>';
            html += '<tr>';
            html += '<th>User ID</th>';
            html += '<th>Username</th>';
            html += '<th>First Name</th>';
            html += '<th>Last Name</th>';
            html += '<th>Email</th>';
            html += '<th>Department</th>';
            html += '<th>Actions</th>';
            html += '</tr>';

            users.forEach(function(user) {
                var originalIndex = allUsers.indexOf(allUsers.find(function(u) { return u.username === user.username; }));
                var isAdmin = user.username === 'admin';
                var isProtected = isAdmin;

                html += '<tr id="user-row-' + originalIndex + '">';
                html += '<td><span class="text-muted" style="font-size:12px;">' + user.userId + '</span></td>';
                html += '<td><strong>' + user.username + '</strong></td>';

                html += '<td>';
                if (isProtected) {
                    html += user.firstName;
                } else {
                    html += '<input type="text" id="fn-' + originalIndex + '" value="' + escapeHtml(user.firstName) + '" style="width:100%;padding:4px 6px;border:1px solid #ccc;">';
                }
                html += '</td>';

                html += '<td>';
                if (isProtected) {
                    html += user.lastName;
                } else {
                    html += '<input type="text" id="ln-' + originalIndex + '" value="' + escapeHtml(user.lastName) + '" style="width:100%;padding:4px 6px;border:1px solid #ccc;">';
                }
                html += '</td>';

                html += '<td>';
                if (isProtected) {
                    html += user.email;
                } else {
                    html += '<input type="email" id="em-' + originalIndex + '" value="' + escapeHtml(user.email) + '" style="width:100%;padding:4px 6px;border:1px solid #ccc;">';
                }
                html += '</td>';

                html += '<td>';
                if (isProtected) {
                    html += user.department;
                } else {
                    html += '<input type="text" id="dp-' + originalIndex + '" value="' + escapeHtml(user.department) + '" style="width:100%;padding:4px 6px;border:1px solid #ccc;">';
                }
                html += '</td>';

                html += '<td>';
                if (isProtected) {
                    html += '<span class="text-muted">Protected</span>';
                } else {
                    html += '<button class="btn btn-small" onclick="saveUser(' + originalIndex + ')">💾 Save</button>';
                    html += ' <button class="btn btn-small" onclick="deleteUser(\'' + user.username + '\')" style="color:#c00;">✕</button>';
                }
                html += '</td>';

                html += '</tr>';
            });

            html += '</table>';
            container.innerHTML = html;
            if (section) section.style.display = 'block';
        }

        function searchUsers() {
            var query = document.getElementById('userSearch').value.toLowerCase().trim();
            var searchId = document.getElementById('searchId').checked;
            var searchName = document.getElementById('searchName').checked;
            var searchEmail = document.getElementById('searchEmail').checked;
            var searchDept = document.getElementById('searchDept').checked;
            var searchUsername = document.getElementById('searchUsername').checked;

            if (!query) {
                if (typeof showAlert === 'function') showAlert('Please enter a search term.', 'error');
                return;
            }

            if (!searchId && !searchName && !searchEmail && !searchDept && !searchUsername) {
                if (typeof showAlert === 'function') showAlert('Please select at least one search field.', 'error');
                return;
            }

            if (allUsers.length === 0) {
                if (typeof showLoading === 'function') showLoading('Searching...');
                loadAllUsers().then(function() {
                    if (typeof hideLoading === 'function') hideLoading();
                    performSearch(query, searchId, searchName, searchEmail, searchDept, searchUsername);
                });
                return;
            }

            performSearch(query, searchId, searchName, searchEmail, searchDept, searchUsername);
        }

        function performSearch(query, searchId, searchName, searchEmail, searchDept, searchUsername) {
            isShowingAll = false;

            var filtered = allUsers.filter(function(user) {
                var match = false;
                if (searchId && user.userId.toLowerCase().indexOf(query) !== -1) match = true;
                if (searchName && (user.firstName.toLowerCase().indexOf(query) !== -1 || user.lastName.toLowerCase().indexOf(query) !== -1)) match = true;
                if (searchEmail && user.email.toLowerCase().indexOf(query) !== -1) match = true;
                if (searchDept && user.department.toLowerCase().indexOf(query) !== -1) match = true;
                if (searchUsername && user.username.toLowerCase().indexOf(query) !== -1) match = true;
                return match;
            });

            filteredUsers = filtered;
            renderUsers(filtered);
        }

        function clearSearchBar() {
            var userSearch = document.getElementById('userSearch');
            if (userSearch) userSearch.value = '';
            if (userSearch) userSearch.focus();
        }

        function showAllUsers() {
            if (allUsers.length === 0) {
                if (typeof showLoading === 'function') showLoading('Loading users...');
                loadAllUsers().then(function() {
                    if (typeof hideLoading === 'function') hideLoading();
                    isShowingAll = true;
                    filteredUsers = allUsers;
                    renderUsers(allUsers);
                });
                return;
            }

            isShowingAll = true;
            filteredUsers = allUsers;
            renderUsers(allUsers);
        }

        function closeUserList() {
            var section = document.getElementById('userListSection');
            var container = document.getElementById('usersContainer');
            var count = document.getElementById('resultCount');
            var search = document.getElementById('userSearch');

            if (section) section.style.display = 'none';
            if (container) container.innerHTML = '<p class="text-muted">No users found.</p>';
            if (count) count.textContent = '';
            if (search) search.value = '';
            isShowingAll = false;
        }

        function saveUser(index) {
            var user = allUsers[index];
            if (!user || user.username === 'admin') return;

            var firstName = document.getElementById('fn-' + index).value.trim();
            var lastName = document.getElementById('ln-' + index).value.trim();
            var email = document.getElementById('em-' + index).value.trim();
            var department = document.getElementById('dp-' + index).value.trim();

            if (!firstName || !lastName || !email || !department) {
                if (typeof showAlert === 'function') showAlert('All fields are required.', 'error');
                return;
            }

            if (typeof showLoading === 'function') showLoading('Saving...');
            adminUpdateUser(user.username, firstName, lastName, email, department);
        }

        async function adminUpdateUser(username, firstName, lastName, email, department) {
            try {
                var response = await fetch(API_URL +
                    '?action=adminupdateuser' +
                    '&adminUsername=' + encodeURIComponent('admin') +
                    '&targetUsername=' + encodeURIComponent(username) +
                    '&firstName=' + encodeURIComponent(firstName) +
                    '&lastName=' + encodeURIComponent(lastName) +
                    '&email=' + encodeURIComponent(email) +
                    '&department=' + encodeURIComponent(department));

                var result = await response.json();
                if (typeof hideLoading === 'function') hideLoading();

                if (result.success) {
                    if (typeof showAlert === 'function') showAlert('User ' + username + ' updated successfully!', 'success');
                    await loadAllUsers();
                    refreshDisplay();
                } else {
                    if (typeof showAlert === 'function') showAlert(result.message || 'Error updating user.', 'error');
                }

            } catch (error) {
                if (typeof hideLoading === 'function') hideLoading();
                console.error('Error:', error);
                if (typeof showAlert === 'function') showAlert('Error connecting to server.', 'error');
            }
        }

        function saveAllUsers() {
            var visibleInputs = document.querySelectorAll('#usersContainer input');
            if (visibleInputs.length === 0) {
                if (typeof showAlert === 'function') showAlert('No editable users found.', 'info');
                return;
            }

            if (!confirm('Save all changes for all displayed users?')) return;

            if (typeof showLoading === 'function') showLoading('Saving all changes...');

            var usersToUpdate = [];
            var displayUsers = isShowingAll ? allUsers : filteredUsers;

            displayUsers.forEach(function(user) {
                if (user.username === 'admin') return;

                var index = allUsers.indexOf(allUsers.find(function(u) { return u.username === user.username; }));
                var firstName = document.getElementById('fn-' + index).value.trim();
                var lastName = document.getElementById('ln-' + index).value.trim();
                var email = document.getElementById('em-' + index).value.trim();
                var department = document.getElementById('dp-' + index).value.trim();

                if (!firstName || !lastName || !email || !department) {
                    if (typeof showAlert === 'function') showAlert('All fields are required for ' + user.username, 'error');
                    return;
                }

                usersToUpdate.push({
                    username: user.username,
                    firstName: firstName,
                    lastName: lastName,
                    email: email,
                    department: department
                });
            });

            if (usersToUpdate.length === 0) {
                if (typeof hideLoading === 'function') hideLoading();
                if (typeof showAlert === 'function') showAlert('No changes to save.', 'info');
                return;
            }

            var completed = 0;
            var errors = [];

            usersToUpdate.forEach(function(user) {
                fetch(API_URL +
                    '?action=adminupdateuser' +
                    '&adminUsername=' + encodeURIComponent('admin') +
                    '&targetUsername=' + encodeURIComponent(user.username) +
                    '&firstName=' + encodeURIComponent(user.firstName) +
                    '&lastName=' + encodeURIComponent(user.lastName) +
                    '&email=' + encodeURIComponent(user.email) +
                    '&department=' + encodeURIComponent(user.department))
                .then(function(response) { return response.json(); })
                .then(function(result) {
                    completed++;
                    if (!result.success) {
                        errors.push(user.username + ': ' + result.message);
                    }
                    if (completed === usersToUpdate.length) {
                        if (typeof hideLoading === 'function') hideLoading();
                        if (errors.length === 0) {
                            if (typeof showAlert === 'function') showAlert('All users updated successfully!', 'success');
                        } else {
                            if (typeof showAlert === 'function') showAlert('Some errors occurred:\n' + errors.join('\n'), 'error');
                        }
                        loadAllUsers().then(function() {
                            refreshDisplay();
                        });
                    }
                })
                .catch(function(error) {
                    completed++;
                    errors.push(user.username + ': ' + error.message);
                    if (completed === usersToUpdate.length) {
                        if (typeof hideLoading === 'function') hideLoading();
                        if (typeof showAlert === 'function') showAlert('Some errors occurred:\n' + errors.join('\n'), 'error');
                        loadAllUsers().then(function() {
                            refreshDisplay();
                        });
                    }
                });
            });
        }

        function refreshDisplay() {
            if (isShowingAll) {
                renderUsers(allUsers);
            } else {
                var query = document.getElementById('userSearch').value.trim();
                if (query) {
                    searchUsers();
                } else {
                    var section = document.getElementById('userListSection');
                    if (section) section.style.display = 'none';
                }
            }
        }

        function deleteUser(username) {
            if (!confirm('Delete user "' + username + '"? This cannot be undone.')) {
                return;
            }

            if (typeof showLoading === 'function') showLoading('Deleting user...');

            fetch(API_URL +
                '?action=deleteuser' +
                '&username=' + encodeURIComponent(username) +
                '&adminUsername=' + encodeURIComponent('admin'))
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (typeof hideLoading === 'function') hideLoading();
                if (result.success) {
                    if (typeof showAlert === 'function') showAlert(result.message, 'success');
                    loadAllUsers().then(function() {
                        refreshDisplay();
                    });
                } else {
                    if (typeof showAlert === 'function') showAlert(result.message || 'Error deleting user.', 'error');
                }
            })
            .catch(function(error) {
                if (typeof hideLoading === 'function') hideLoading();
                console.error('Error:', error);
                if (typeof showAlert === 'function') showAlert('Error connecting to server.', 'error');
            });
        }

        function deleteAllUsers() {
            if (!confirm('Delete ALL non-admin users? This cannot be undone.')) {
                return;
            }

            if (!confirm('Are you absolutely sure? All user accounts (except admin) will be deleted.')) {
                return;
            }

            if (typeof showLoading === 'function') showLoading('Deleting all users...');

            fetch(API_URL +
                '?action=deleteallusers&adminUsername=' + encodeURIComponent('admin'))
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (typeof hideLoading === 'function') hideLoading();
                if (result.success) {
                    if (typeof showAlert === 'function') showAlert(result.message, 'success');
                    loadAllUsers().then(function() {
                        refreshDisplay();
                    });
                } else {
                    if (typeof showAlert === 'function') showAlert(result.message || 'Error deleting users.', 'error');
                }
            })
            .catch(function(error) {
                if (typeof hideLoading === 'function') hideLoading();
                console.error('Error:', error);
                if (typeof showAlert === 'function') showAlert('Error connecting to server.', 'error');
            });
        }
    </script>

</body>
</html>
