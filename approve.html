<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approve Orders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER PLACEHOLDER -->
    <div id="header"></div>

    <!-- ===== PAGE CONTENT ===== -->
    <!-- SEARCH SECTION -->
    <div class="section-box">
        <div class="flex flex-wrap gap-10" style="align-items:center;">
            <div style="flex:1;min-width:150px;">
                <input type="text" id="orderSearch" placeholder="Search by Order ID or Department..." style="width:100%;padding:6px 8px;border:1px solid #ccc;">
            </div>
            <button class="btn" onclick="searchOrders()">Search</button>
            <button class="btn" onclick="clearSearch()">Clear</button>
            <button class="btn" onclick="loadPendingOrders()">Refresh</button>
        </div>
        <div style="margin-top:10px;font-size:13px;color:#888;">
            <span id="resultCount">0 pending orders</span>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="orders-main" style="display:flex;gap:20px;">

        <!-- LEFT PANEL -->
        <div class="left-panel" style="flex:1;min-width:0;">
            <div class="section-box">
                <h2>Pending Orders</h2>
                <div id="orderListContainer">
                    <p class="text-muted">No pending orders.</p>
                </div>
                <div id="pagination" style="display:none;margin-top:15px;gap:10px;align-items:center;flex-wrap:wrap;">
                    <button class="btn btn-small" onclick="prevPage()">◀ Previous</button>
                    <span id="pageInfo" class="text-muted"></span>
                    <button class="btn btn-small" onclick="nextPage()">Next ▶</button>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel" style="flex:1;min-width:0;display:none;" id="orderDetailsPanel">
            <div class="section-box">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
                    <h2>Order Details</h2>
                    <button onclick="closeOrderDetails()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#999;" title="Close">✕</button>
                </div>
                <div id="orderDetailsContainer">
                    <p class="text-muted">Select an order to view details.</p>
                </div>
            </div>
        </div>

    </div>

    <!-- FOOTER PLACEHOLDER -->
    <div id="footer"></div>

    <script>
        // ============================================================
        // LOAD HEADER AND FOOTER, THEN INITIALIZE
        // ============================================================

        var headerLoaded = false;
        var footerLoaded = false;

        function checkReady() {
            if (headerLoaded && footerLoaded) {
                var script = document.createElement('script');
                script.src = 'script.js';
                script.onload = function() {
                    if (typeof initPage === 'function') {
                        initPage();
                    }
                };
                document.body.appendChild(script);
            }
        }

        fetch('header.html')
            .then(function(response) { return response.text(); })
            .then(function(html) {
                document.getElementById('header').innerHTML = html;
                headerLoaded = true;
                checkReady();
            })
            .catch(function(error) {
                console.error('Error loading header:', error);
                headerLoaded = true;
                checkReady();
            });

        fetch('footer.html')
            .then(function(response) { return response.text(); })
            .then(function(html) {
                document.getElementById('footer').innerHTML = html;
                footerLoaded = true;
                checkReady();
            })
            .catch(function(error) {
                console.error('Error loading footer:', error);
                footerLoaded = true;
                checkReady();
            });

        // ============================================================
        // APPROVE.HTML SPECIFIC
        // ============================================================

        var pendingOrders = [];
        var filteredOrders = [];
        var selectedOrderId = null;
        var currentPage = 1;
        var pageSize = 10;

        function initPage() {
            if (!checkAuth()) return;

            var user = getCurrentUser();
            var userDisplay = document.getElementById('userDisplay');
            if (userDisplay) userDisplay.textContent = 'Welcome, ' + user.fullName;

            var roleDisplay = document.getElementById('roleDisplay');
            if (roleDisplay) roleDisplay.textContent = user.isAdmin ? '(Admin)' : '(User)';

            if (typeof initNav === 'function') initNav();

            if (!user.isAdmin) {
                var container = document.getElementById('orderListContainer');
                if (container) container.innerHTML = '<p class="text-muted">Admin access required.</p>';
                var rightPanel = document.querySelector('.right-panel');
                if (rightPanel) rightPanel.style.display = 'none';
                return;
            }

            loadPendingOrders();

            // Set up search enter key
            var orderSearch = document.getElementById('orderSearch');
            if (orderSearch) {
                orderSearch.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        searchOrders();
                    }
                });
            }
        }

        async function loadPendingOrders() {
            var container = document.getElementById('orderListContainer');
            if (container) container.innerHTML = '<p class="text-muted">Loading pending orders...</p>';

            try {
                var response = await fetch(API_URL + '?action=getorders&status=pending');
                var results = await response.json();

                pendingOrders = results;
                filteredOrders = results;
                currentPage = 1;
                renderOrderList();
                updateResultCount();
                closeOrderDetails();

            } catch (error) {
                console.error('Error loading orders:', error);
                if (container) container.innerHTML = '<p class="text-muted">Error loading orders.</p>';
                if (typeof showAlert === 'function') showAlert('Error loading orders.', 'error');
            }
        }

        function searchOrders() {
            var searchTerm = document.getElementById('orderSearch').value.toLowerCase().trim();

            if (!searchTerm) {
                filteredOrders = pendingOrders;
            } else {
                filteredOrders = pendingOrders.filter(function(order) {
                    return order.orderId.toLowerCase().indexOf(searchTerm) !== -1 ||
                           order.department.toLowerCase().indexOf(searchTerm) !== -1 ||
                           order.username.toLowerCase().indexOf(searchTerm) !== -1;
                });
            }

            currentPage = 1;
            renderOrderList();
            updateResultCount();
            closeOrderDetails();
        }

        function clearSearch() {
            var orderSearch = document.getElementById('orderSearch');
            if (orderSearch) orderSearch.value = '';
            filteredOrders = pendingOrders;
            currentPage = 1;
            renderOrderList();
            updateResultCount();
            closeOrderDetails();
            if (typeof showAlert === 'function') showAlert('Search cleared.', 'info');
        }

        function updateResultCount() {
            var count = document.getElementById('resultCount');
            if (count) count.textContent = filteredOrders.length + ' pending order(s)';
        }

        function renderOrderList() {
            var container = document.getElementById('orderListContainer');
            var pagination = document.getElementById('pagination');
            var pageInfo = document.getElementById('pageInfo');

            if (!container) return;

            if (filteredOrders.length === 0) {
                container.innerHTML = '<p class="text-muted">No pending orders found.</p>';
                if (pagination) pagination.style.display = 'none';
                return;
            }

            var totalPages = Math.ceil(filteredOrders.length / pageSize);
            var start = (currentPage - 1) * pageSize;
            var end = Math.min(start + pageSize, filteredOrders.length);
            var pageOrders = filteredOrders.slice(start, end);

            if (filteredOrders.length > pageSize) {
                if (pageInfo) pageInfo.textContent = 'Page ' + currentPage + ' of ' + totalPages;
                if (pagination) pagination.style.display = 'flex';
            } else {
                if (pagination) pagination.style.display = 'none';
            }

            var html = '';

            pageOrders.forEach(function(order) {
                var date = order.timestamp ? new Date(order.timestamp).toLocaleString() : 'Unknown';
                var itemCount = order.items ? order.items.length : 0;
                var isSelected = selectedOrderId === order.orderId ? 'style="background:#e8f0fe;border-left:3px solid #2b6cb0;"' : '';

                html += `
                    <div class="order-list-item" onclick="selectOrder('${order.orderId}')" ${isSelected} style="padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer;transition:background 0.2s;border-left:3px solid transparent;">
                        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px;">
                            <div>
                                <strong style="font-size:14px;">${order.orderId}</strong>
                                <span style="font-size:12px;color:#888;margin-left:10px;">${date}</span>
                            </div>
                            <span style="color:#d69e2e;font-weight:bold;font-size:13px;">PENDING</span>
                        </div>
                        <div style="font-size:12px;color:#888;margin-top:4px;">
                            ${itemCount} item(s) · ${order.department || 'N/A'} · ${order.username || 'Unknown'}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderOrderList();
            }
        }

        function nextPage() {
            var totalPages = Math.ceil(filteredOrders.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderOrderList();
            }
        }

        function selectOrder(orderId) {
            selectedOrderId = orderId;

            var items = document.querySelectorAll('.order-list-item');
            items.forEach(function(item) {
                item.style.background = '';
                item.style.borderLeft = '3px solid transparent';
            });

            var selectedItem = document.querySelector('.order-list-item[onclick="selectOrder(\'' + orderId + '\')"]');
            if (selectedItem) {
                selectedItem.style.background = '#e8f0fe';
                selectedItem.style.borderLeft = '3px solid #2b6cb0';
            }

            var order = pendingOrders.find(function(o) { return o.orderId === orderId; });
            if (order) {
                renderOrderDetails(order);
                var panel = document.getElementById('orderDetailsPanel');
                if (panel) panel.style.display = 'block';
            }
        }

        function closeOrderDetails() {
            var panel = document.getElementById('orderDetailsPanel');
            if (panel) panel.style.display = 'none';
            selectedOrderId = null;
        }

        // ============================================================
        // SOFT DELETE ITEM (X button)
        // ============================================================
        
        function deleteItem(orderId, index) {
            // Find the order
            var order = pendingOrders.find(function(o) { return o.orderId === orderId; });
            if (!order) return;
        
            // Add to deleted items list if not already there
            if (order._deletedItems.indexOf(index) === -1) {
                order._deletedItems.push(index);
            }
        
            // Re-render the details
            renderOrderDetails(order);
        }
        
        
        // ============================================================
        // RESTORE ITEM (↩️ Restore button)
        // ============================================================
        
        function restoreItem(orderId, index) {
            var order = pendingOrders.find(function(o) { return o.orderId === orderId; });
            if (!order) return;
        
            // Remove from deleted items list
            var pos = order._deletedItems.indexOf(index);
            if (pos !== -1) {
                order._deletedItems.splice(pos, 1);
            }
        
            // Re-render the details
            renderOrderDetails(order);
        }
        
        
        // ============================================================
        // GET ACTIVE ITEMS (excludes deleted ones)
        // ============================================================
        
        function getActiveItems(order) {
            if (!order || !order.items) return [];
            return order.items.filter(function(item, index) {
                return order._deletedItems.indexOf(index) === -1;
            });
        }

        function renderOrderDetails(order) {
            var container = document.getElementById('orderDetailsContainer');
        
            if (!container) return;
        
            var date = order.timestamp ? new Date(order.timestamp).toLocaleString() : 'Unknown';
        
            // ============================================================
            // TRACK SOFT-DELETED ITEMS
            // ============================================================
            if (!order._deletedItems) {
                order._deletedItems = [];
            }
        
            // ============================================================
            // BUILD ITEMS WITH SOFT DELETE
            // ============================================================
            var itemsHtml = '';
            if (order.items && order.items.length > 0) {
                itemsHtml = '<div style="margin-top:10px;">';
        
                order.items.forEach(function(item, index) {
                    var isDeleted = order._deletedItems.indexOf(index) !== -1;
                    var itemId = 'item-' + order.orderId + '-' + index;
        
                    // Style: greyed out with strikethrough if deleted
                    var rowStyle = isDeleted ? 
                        'opacity:0.5;text-decoration:line-through;background:#f5f5f5;' : 
                        '';
        
                    var actionButton = isDeleted ?
                        `<button onclick="restoreItem('${order.orderId}', ${index})" style="background:none;border:1px solid #38a169;color:#38a169;cursor:pointer;padding:2px 10px;border-radius:4px;font-size:12px;">↩️ Restore</button>` :
                        `<button onclick="deleteItem('${order.orderId}', ${index})" style="background:none;border:none;color:#c00;cursor:pointer;font-size:16px;padding:0 5px;" title="Remove item">✕</button>`;
        
                    itemsHtml += `
                        <div id="${itemId}" style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #f0f0f0;${rowStyle}">
                            <span style="flex:1;font-weight:500;${isDeleted ? 'text-decoration:line-through;' : ''}">${item.drug}</span>
                            <span style="font-size:13px;color:#888;">Available: ${item.available || 'N/A'}</span>
                            <input type="number" id="qty-${order.orderId}-${index}" value="${item.quantity}" min="1" max="${item.available || 999}" style="width:60px;padding:4px 6px;border:1px solid #ccc;text-align:center;${isDeleted ? 'opacity:0.5;' : ''}" ${isDeleted ? 'disabled' : ''}>
                            ${actionButton}
                        </div>
                    `;
                });
        
                itemsHtml += '</div>';
            } else {
                itemsHtml = '<p class="text-muted">No items in this order.</p>';
            }
        
            // ============================================================
            // NOTES SECTION
            // ============================================================
            var notesHtml = '';
            if (order.notes) {
                var formattedNotes = order.notes;
                formattedNotes = formattedNotes.replace(/\[User: ([^\]]+)\]\s*/g, '<strong>User:</strong> $1<br>');
                formattedNotes = formattedNotes.replace(/\[Admin: ([^\]]+)\]\s*/g, '<strong>Admin:</strong> $1<br>');
                formattedNotes = formattedNotes.replace(/\[Approved By: ([^\]]+)\]/g, '<strong>Approved By:</strong> $1');
                formattedNotes = formattedNotes.replace(/\n/g, '<br>');
        
                notesHtml = `
                    <div style="margin-top:12px;padding:10px;background:#f7fafc;border-radius:4px;border-left:3px solid #2b6cb0;">
                        <strong>📝 Notes:</strong>
                        <div style="margin:6px 0 0 0;font-size:14px;color:#555;line-height:1.8;">
                            ${formattedNotes}
                        </div>
                    </div>
                `;
            }
        
            // ============================================================
            // REPLY SECTION
            // ============================================================
            var replyHtml = `
                <div style="margin-top:10px;">
                    <label style="font-weight:500;font-size:14px;">💬 Reply to User:</label>
                    <textarea id="replyNote-${order.orderId}" placeholder="Add a reply to the user (optional)..." style="width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:4px;font-size:14px;font-family:inherit;resize:vertical;min-height:50px;margin-top:4px;"></textarea>
                </div>
            `;
        
            // ============================================================
            // DELETED ITEMS COUNT
            // ============================================================
            var deletedCount = order._deletedItems.length;
            var deletedInfo = deletedCount > 0 ? 
                `<span style="font-size:12px;color:#888;margin-left:10px;">(${deletedCount} item(s) will be removed)</span>` : 
                '';
        
            // ============================================================
            // RENDER FULL DETAILS
            // ============================================================
            var html = `
                <div style="margin-bottom:15px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                        <h3 style="font-weight:normal;font-size:18px;">${order.orderId}</h3>
                        <span style="color:#d69e2e;font-weight:bold;">PENDING</span>
                    </div>
                    <div style="margin-top:10px;font-size:14px;color:#555;">
                        <div><strong>Date:</strong> ${date}</div>
                        <div><strong>Department:</strong> ${order.department || 'N/A'}</div>
                        <div><strong>Requested By:</strong> ${order.username || 'Unknown'}</div>
                    </div>
                </div>
                <hr style="border:none;border-top:1px solid #eee;">
                <div style="margin-top:10px;">
                    <strong>Items:</strong> ${deletedInfo}
                    ${itemsHtml}
                </div>
                ${notesHtml}
                ${replyHtml}
                <div style="display:flex;gap:10px;margin-top:15px;flex-wrap:wrap;">
                    <button class="btn" onclick="approveOrder('${order.orderId}')" style="background:#38a169;color:white;border:none;">✅ Approve</button>
                    <button class="btn" onclick="declineOrder('${order.orderId}')" style="background:#e53e3e;color:white;border:none;">❌ Decline</button>
                </div>
            `;
        
            container.innerHTML = html;
        }

            // ============================================================
            // BUILD THE REST OF THE DETAILS
            // ============================================================
        
            // ============================================================
            // NOTES SECTION - USER/ADMIN FORMAT
            // ============================================================

            var notesHtml = '';
            if (order.notes) {
                // Format notes with User/Admin labels
                var formattedNotes = order.notes;
                
                // Replace [User: xxx] with "User: xxx"
                formattedNotes = formattedNotes.replace(/\[User: ([^\]]+)\]\s*/g, '<strong>User:</strong> $1<br>');
                
                // Replace [Admin: xxx] with "Admin: xxx"
                formattedNotes = formattedNotes.replace(/\[Admin: ([^\]]+)\]\s*/g, '<strong>Admin:</strong> $1<br>');
                
                // Replace [Approved By: xxx] with "Approved By: xxx"
                formattedNotes = formattedNotes.replace(/\[Approved By: ([^\]]+)\]/g, '<strong>Approved By:</strong> $1');
                
                // Replace newlines with <br>
                formattedNotes = formattedNotes.replace(/\n/g, '<br>');
            
                notesHtml = `
                    <div style="margin-top:12px;padding:10px;background:#f7fafc;border-radius:4px;border-left:3px solid #2b6cb0;">
                        <strong>📝 Notes:</strong>
                        <div style="margin:6px 0 0 0;font-size:14px;color:#555;line-height:1.8;">
                            ${formattedNotes}
                        </div>
                    </div>
                `;
            }
        
            var replyHtml = `
                <div style="margin-top:10px;">
                    <label style="font-weight:500;font-size:14px;">💬 Reply to User:</label>
                    <textarea id="replyNote-${order.orderId}" placeholder="Add a reply to the user (optional)..." style="width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:4px;font-size:14px;font-family:inherit;resize:vertical;min-height:50px;margin-top:4px;"></textarea>
                </div>
            `;
        
            var html = `
                <div style="margin-bottom:15px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                        <h3 style="font-weight:normal;font-size:18px;">${order.orderId}</h3>
                        <span style="color:#d69e2e;font-weight:bold;">PENDING</span>
                    </div>
                    <div style="margin-top:10px;font-size:14px;color:#555;">
                        <div><strong>Date:</strong> ${date}</div>
                        <div><strong>Department:</strong> ${order.department || 'N/A'}</div>
                        <div><strong>Requested By:</strong> ${order.username || 'Unknown'}</div>
                    </div>
                </div>
                <hr style="border:none;border-top:1px solid #eee;">
                <div style="margin-top:10px;">
                    <strong>Items:</strong>
                    ${itemsHtml}
                </div>
                ${notesHtml}
                ${replyHtml}
                <div style="display:flex;gap:10px;margin-top:15px;flex-wrap:wrap;">
                    <button class="btn" onclick="approveOrder('${order.orderId}')" style="background:#38a169;color:white;border:none;">✅ Approve</button>
                    <button class="btn" onclick="declineOrder('${order.orderId}')" style="background:#e53e3e;color:white;border:none;">❌ Decline</button>
                </div>
            `;
        
            container.innerHTML = html;
        }
        
        function removeItem(orderId, index) {
            if (!confirm('Remove this item from the order?')) return;
        
            var url = API_URL +
                '?action=removeitemfromorder' +
                '&orderId=' + encodeURIComponent(orderId) +
                '&itemIndex=' + encodeURIComponent(index);
        
            fetch(url)
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (result.success) {
                    if (typeof showAlert === 'function') showAlert('Item removed.', 'info');
        
                    var order = pendingOrders.find(function(o) { return o.orderId === orderId; });
                    if (order && order.items) {
                        order.items.splice(index, 1);
                        renderOrderDetails(order);
                        renderOrderList();
                        if (order.items.length === 0) {
                            pendingOrders = pendingOrders.filter(function(o) { return o.orderId !== orderId; });
                            filteredOrders = filteredOrders.filter(function(o) { return o.orderId !== orderId; });
                            closeOrderDetails();
                            renderOrderList();
                            updateResultCount();
                        }
                    }
                } else {
                    if (typeof showAlert === 'function') showAlert(result.message || 'Error removing item.', 'error');
                }
            })
            .catch(function(error) {
                console.error('Error:', error);
                if (typeof showAlert === 'function') showAlert('Error connecting to server.', 'error');
            });
        }

        function approveOrder(orderId) {
            if (!confirm('Approve this order? This will deduct stock from inventory.')) return;
        
            if (typeof showLoading === 'function') showLoading('Approving order...');
        
            var order = pendingOrders.find(function(o) { return o.orderId === orderId; });
            if (!order) {
                if (typeof hideLoading === 'function') hideLoading();
                if (typeof showAlert === 'function') showAlert('Order not found.', 'error');
                return;
            }
        
            // ============================================================
            // ONLY APPROVE ACTIVE ITEMS (not deleted)
            // ============================================================
            var activeItems = [];
            var hasError = false;
        
            order.items.forEach(function(item, index) {
                // Skip deleted items
                if (order._deletedItems && order._deletedItems.indexOf(index) !== -1) {
                    return;
                }
        
                var qtyInput = document.getElementById('qty-' + orderId + '-' + index);
                var qty = qtyInput ? parseInt(qtyInput.value) : item.quantity;
        
                if (qty < 1) {
                    if (typeof showAlert === 'function') showAlert('Quantity for ' + item.drug + ' must be at least 1.', 'error');
                    hasError = true;
                    return;
                }
        
                activeItems.push({
                    drug: item.drug,
                    quantity: qty
                });
            });
        
            if (hasError) {
                if (typeof hideLoading === 'function') hideLoading();
                return;
            }
        
            if (activeItems.length === 0) {
                if (typeof hideLoading === 'function') hideLoading();
                if (typeof showAlert === 'function') showAlert('No active items to approve. All items have been removed.', 'warning');
                return;
            }
        
            // Get reply note
            var replyNote = document.getElementById('replyNote-' + orderId);
            var note = replyNote ? replyNote.value.trim() : '';
        
            var url = API_URL +
                '?action=approveorder' +
                '&orderId=' + encodeURIComponent(orderId) +
                '&admin=' + encodeURIComponent(localStorage.getItem('username')) +
                '&items=' + encodeURIComponent(JSON.stringify(activeItems)) +
                '&note=' + encodeURIComponent(note);
        
            fetch(url)
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (typeof hideLoading === 'function') hideLoading();
                if (result.success) {
                    if (typeof showAlert === 'function') showAlert('Order approved successfully! Stock has been deducted.', 'success');
                    pendingOrders = pendingOrders.filter(function(o) { return o.orderId !== orderId; });
                    filteredOrders = filteredOrders.filter(function(o) { return o.orderId !== orderId; });
                    closeOrderDetails();
                    renderOrderList();
                    updateResultCount();
                } else {
                    if (typeof showAlert === 'function') showAlert(result.message || 'Error approving order.', 'error');
                }
            })
            .catch(function(error) {
                if (typeof hideLoading === 'function') hideLoading();
                console.error('Error:', error);
                if (typeof showAlert === 'function') showAlert('Error connecting to server.', 'error');
            });
        }
        
        function declineOrder(orderId) {
            var reason = prompt('Reason for declining (optional):');
            if (reason === null) return;

            if (typeof showLoading === 'function') showLoading('Declining order...');

            var replyNote = document.getElementById('replyNote-' + orderId);
            var note = replyNote ? replyNote.value.trim() : '';

            var url = API_URL +
                '?action=declineorder' +
                '&orderId=' + encodeURIComponent(orderId) +
                '&admin=' + encodeURIComponent(localStorage.getItem('username')) +
                '&reason=' + encodeURIComponent(reason || 'No reason provided') +
                '&note=' + encodeURIComponent(note);

            fetch(url)
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (typeof hideLoading === 'function') hideLoading();
                if (result.success) {
                    if (typeof showAlert === 'function') showAlert('Order declined.', 'info');
                    pendingOrders = pendingOrders.filter(function(o) { return o.orderId !== orderId; });
                    filteredOrders = filteredOrders.filter(function(o) { return o.orderId !== orderId; });
                    closeOrderDetails();
                    renderOrderList();
                    updateResultCount();
                } else {
                    if (typeof showAlert === 'function') showAlert(result.message || 'Error declining order.', 'error');
                }
            })
            .catch(function(error) {
                if (typeof hideLoading === 'function') hideLoading();
                console.error('Error:', error);
                if (typeof showAlert === 'function') showAlert('Error connecting to server.', 'error');
            });
        }
    </script>

</body>
</html>
