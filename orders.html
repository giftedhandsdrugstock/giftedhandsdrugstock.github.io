<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Orders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header"></div>

    <!-- ===== PAGE CONTENT ===== -->
    <!-- SEARCH SECTION -->
    <div class="section-box">
        <div class="flex flex-wrap gap-10" style="align-items:center;">
            <div style="flex:1;min-width:200px;">
                <input type="text" id="drugSearch" placeholder="Search by drug name or form..." style="width:100%;padding:6px 8px;border:1px solid #ccc;">
            </div>
            <button class="btn" onclick="searchDrugs()">Search</button>
            <button class="btn" onclick="clearSearch()">Clear</button>
            <button class="btn" id="toggleDrugsBtn" onclick="toggleDrugList()">Show All Drugs</button>
            <button class="btn" id="newOrderBtn" onclick="toggleNewOrder()">➕ New Order</button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="orders-main" style="display:flex;gap:20px;">

        <!-- LEFT PANEL - 2/3 (hidden by default) -->
        <div class="left-panel" style="flex:2;min-width:0;display:none;" id="drugListPanel">
            <div class="section-box">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
                    <h2>Drug List</h2>
                    <div>
                        <span id="drugCount" class="text-muted"></span>
                        <button id="closeDrugListBtn" onclick="closeDrugList()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#999;margin-left:10px;" title="Close Drug List">✕</button>
                    </div>
                </div>
                <div id="drugListContainer">
                    <p class="text-muted">No drugs found.</p>
                </div>
                <div id="pagination" style="display:none;margin-top:15px;gap:10px;align-items:center;flex-wrap:wrap;">
                    <button class="btn btn-small" onclick="prevPage()">◀ Previous</button>
                    <span id="pageInfo" class="text-muted"></span>
                    <button class="btn btn-small" onclick="nextPage()">Next ▶</button>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL - 1/3 (hidden by default) -->
        <div class="right-panel" style="flex:1;min-width:0;display:none;" id="orderPanel">
            <div class="section-box">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
                    <h2>New Order</h2>
                    <div>
                        <span id="orderIdDisplay" class="text-muted" style="font-size:13px;"></span>
                        <button onclick="toggleNewOrder()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#999;margin-left:10px;" title="Close Order Panel">✕</button>
                    </div>
                </div>
                <div id="orderListContainer" style="margin-top:10px;">
                    <p class="text-muted">No items added yet. Search and add drugs.</p>
                </div>
                <div style="margin-top:15px;border-top:1px solid #eee;padding-top:12px;">
                    <label style="font-weight:500;font-size:14px;display:block;margin-bottom:4px;">📝 Order Notes</label>
                    <textarea id="orderNotes" placeholder="Add notes for the admin..." style="width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:4px;font-size:14px;font-family:inherit;resize:vertical;min-height:60px;"></textarea>
                </div>
                <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
                    <button class="btn" onclick="submitOrder()">📤 Submit Order</button>
                    <button class="btn" onclick="clearOrder()" style="color:#c00;">🗑️ Cancel Order</button>
                </div>
            </div>
        </div>

    </div>

    <div id="footer"></div>

    <script>
        // ============================================================
        // LOAD HEADER AND FOOTER
        // ============================================================

        fetch('header.html')
            .then(function(r) { return r.text(); })
            .then(function(html) {
                document.getElementById('header').innerHTML = html;
                return fetch('footer.html');
            })
            .then(function(r) { return r.text(); })
            .then(function(html) {
                document.getElementById('footer').innerHTML = html;
            })
            .catch(function(error) {
                console.error('Error loading header/footer:', error);
            });

        // ============================================================
        // ORDERS.HTML SPECIFIC
        // ============================================================

        var allDrugs = [];
        var filteredDrugs = [];
        var currentPage = 1;
        var pageSize = 10;
        var orderItems = [];
        var currentUser = {};
        var isDrugListVisible = false;
        var isNewOrderOpen = false;
        var currentOrderId = '';

        // ============================================================
        // GENERATE ORDER ID
        // ============================================================

        function generateOrderId() {
            var timestamp = Date.now().toString(36).toUpperCase();
            var random = Math.random().toString(36).substring(2, 6).toUpperCase();
            return 'ORD-' + timestamp + '-' + random;
        }

        // ============================================================
        // INIT
        // ============================================================

        function initPage() {
            if (!checkAuth()) return;

            currentUser = getCurrentUser();
            document.getElementById('userDisplay').textContent = 'Welcome, ' + currentUser.fullName;
            document.getElementById('roleDisplay').textContent = currentUser.isAdmin ? '(Admin)' : '(User)';

            if (currentUser.isAdmin) {
                document.querySelector('.left-panel').style.display = 'none';
                document.querySelector('.section-box:first-of-type').style.display = 'none';
                document.getElementById('newOrderBtn').style.display = 'none';
                showAlert('Admin cannot place orders. Only approver rights.', 'info');
            }

            initNav();
            loadDrugsSilent();
        }

        // ============================================================
        // TOGGLE NEW ORDER
        // ============================================================

        function toggleNewOrder() {
            var panel = document.getElementById('orderPanel');
            var btn = document.getElementById('newOrderBtn');

            if (isNewOrderOpen) {
                if (orderItems.length > 0) {
                    if (!confirm('You have items in your order. Cancel order?')) {
                        return;
                    }
                    orderItems = [];
                }
                panel.style.display = 'none';
                btn.textContent = '➕ New Order';
                isNewOrderOpen = false;
                document.getElementById('orderIdDisplay').textContent = '';
                document.getElementById('orderNotes').value = '';
                renderOrderList();
            } else {
                panel.style.display = 'block';
                btn.textContent = '✕ Cancel Order';
                isNewOrderOpen = true;
                currentOrderId = generateOrderId();
                document.getElementById('orderIdDisplay').textContent = 'Order: ' + currentOrderId;
                document.getElementById('orderNotes').value = '';
                renderOrderList();
            }
        }

        // ============================================================
        // SHOW/HIDE DRUG LIST
        // ============================================================

        function toggleDrugList() {
            var panel = document.getElementById('drugListPanel');
            var container = document.getElementById('drugListContainer');
            var btn = document.getElementById('toggleDrugsBtn');
            var closeBtn = document.getElementById('closeDrugListBtn');

            if (isDrugListVisible) {
                panel.style.display = 'none';
                btn.textContent = 'Show All Drugs';
                closeBtn.style.display = 'none';
                isDrugListVisible = false;
                document.getElementById('drugSearch').value = '';
            } else {
                if (allDrugs.length === 0) {
                    showLoading('Loading drugs...');
                    loadDrugsSilent().then(function() {
                        hideLoading();
                        if (allDrugs.length === 0) {
                            container.innerHTML = '<p class="text-muted">No drugs found.</p>';
                            panel.style.display = 'block';
                            btn.textContent = 'Hide Drugs';
                            closeBtn.style.display = 'inline';
                            isDrugListVisible = true;
                        } else {
                            filteredDrugs = allDrugs;
                            currentPage = 1;
                            renderDrugList();
                            panel.style.display = 'block';
                            btn.textContent = 'Hide Drugs';
                            closeBtn.style.display = 'inline';
                            isDrugListVisible = true;
                        }
                    });
                    return;
                }

                filteredDrugs = allDrugs;
                currentPage = 1;
                renderDrugList();
                panel.style.display = 'block';
                btn.textContent = 'Hide Drugs';
                closeBtn.style.display = 'inline';
                isDrugListVisible = true;
            }
        }

        // ============================================================
        // CLOSE DRUG LIST
        // ============================================================

        function closeDrugList() {
            var panel = document.getElementById('drugListPanel');
            var btn = document.getElementById('toggleDrugsBtn');
            var closeBtn = document.getElementById('closeDrugListBtn');

            panel.style.display = 'none';
            btn.textContent = 'Show All Drugs';
            closeBtn.style.display = 'none';
            isDrugListVisible = false;
            document.getElementById('drugSearch').value = '';
        }

        // ============================================================
        // LOAD DRUGS SILENTLY
        // ============================================================

        async function loadDrugsSilent() {
            try {
                var response = await fetch(API_URL + '?search=');
                var results = await response.json();

                allDrugs = results.map(function(item) {
                    return {
                        name: item[0] || 'Unknown',
                        form: item[1] || 'Unknown',
                        balance: parseFloat(item[2]) || 0
                    };
                });

                filteredDrugs = allDrugs;

            } catch (error) {
                console.error('Error loading drugs:', error);
            }
        }

        // ============================================================
        // SEARCH DRUGS
        // ============================================================

        function searchDrugs() {
            var query = document.getElementById('drugSearch').value.toLowerCase().trim();

            if (!query) {
                showAlert('Please enter a search term.', 'error');
                return;
            }

            var panel = document.getElementById('drugListPanel');
            var btn = document.getElementById('toggleDrugsBtn');
            var closeBtn = document.getElementById('closeDrugListBtn');

            if (!isDrugListVisible) {
                if (allDrugs.length === 0) {
                    showLoading('Loading drugs...');
                    loadDrugsSilent().then(function() {
                        hideLoading();
                        performSearch(query);
                        panel.style.display = 'block';
                        btn.textContent = 'Hide Drugs';
                        closeBtn.style.display = 'inline';
                        isDrugListVisible = true;
                    });
                    return;
                }

                filteredDrugs = allDrugs;
                currentPage = 1;
                panel.style.display = 'block';
                btn.textContent = 'Hide Drugs';
                closeBtn.style.display = 'inline';
                isDrugListVisible = true;
                performSearch(query);
            } else {
                performSearch(query);
            }
        }

        function performSearch(query) {
            showLoading('Searching for: ' + query);

            setTimeout(function() {
                filteredDrugs = allDrugs.filter(function(drug) {
                    return drug.name.toLowerCase().indexOf(query) !== -1 ||
                           drug.form.toLowerCase().indexOf(query) !== -1;
                });

                currentPage = 1;
                hideLoading();

                if (filteredDrugs.length === 0) {
                    document.getElementById('drugListContainer').innerHTML = '<p class="text-muted">No drugs found matching "' + query + '".</p>';
                    document.getElementById('drugCount').textContent = '0 drugs';
                    document.getElementById('pagination').style.display = 'none';
                } else {
                    renderDrugList();
                }
            }, 300);
        }

        // ============================================================
        // CLEAR SEARCH
        // ============================================================

        function clearSearch() {
            document.getElementById('drugSearch').value = '';

            if (isDrugListVisible) {
                renderDrugList();
            } else {
                var panel = document.getElementById('drugListPanel');
                panel.style.display = 'none';
                document.getElementById('drugListContainer').innerHTML = '<p class="text-muted">Search for a drug or click "Show All Drugs".</p>';
                document.getElementById('drugCount').textContent = '';
                document.getElementById('pagination').style.display = 'none';
            }

            document.getElementById('drugSearch').focus();
            showAlert('Search cleared.', 'info');
        }

        // ============================================================
        // RENDER DRUG LIST
        // ============================================================

        function renderDrugList() {
            var container = document.getElementById('drugListContainer');
            var count = document.getElementById('drugCount');
            var pagination = document.getElementById('pagination');
            var pageInfo = document.getElementById('pageInfo');

            if (!filteredDrugs || filteredDrugs.length === 0) {
                container.innerHTML = '<p class="text-muted">No drugs found.</p>';
                count.textContent = '0 drugs';
                pagination.style.display = 'none';
                return;
            }

            var totalPages = Math.ceil(filteredDrugs.length / pageSize);
            var start = (currentPage - 1) * pageSize;
            var end = Math.min(start + pageSize, filteredDrugs.length);
            var pageDrugs = filteredDrugs.slice(start, end);

            count.textContent = filteredDrugs.length + ' drugs';

            if (filteredDrugs.length > pageSize) {
                pageInfo.textContent = 'Page ' + currentPage + ' of ' + totalPages;
                pagination.style.display = 'flex';
            } else {
                pagination.style.display = 'none';
            }

            var html = '<table>';
            html += '<tr><th>Drug Name</th><th>Form</th><th>Balance</th><th>Order Qty</th><th>Action</th></tr>';

            pageDrugs.forEach(function(drug, index) {
                var globalIndex = start + index;
                var inOrder = orderItems.some(function(item) { return item.name === drug.name; });
                var safeId = 'qty-' + globalIndex;

                html += '<tr>';
                html += '<td><strong>' + drug.name + '</strong
