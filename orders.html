<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Orders</title>
    <style>
        /* ============================================================
           RESET
           ============================================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            padding: 20px;
        }
        
        .app-wrapper {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        /* ============================================================
           HEADER (same as search.html)
           ============================================================ */
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 2px solid #e5e7eb;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .header-left h1 {
            font-size: 24px;
            font-weight: 700;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        
        .user-info .role {
            color: #6b7280;
            font-size: 12px;
        }
        
        .nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .nav a,
        .nav button {
            padding: 6px 14px;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            text-decoration: none;
            color: #111827;
            font-size: 14px;
            cursor: pointer;
        }
        
        .nav a:hover,
        .nav button:hover {
            background: #e5e7eb;
        }
        
        .nav .admin-link {
            display: none;
        }
        
        .nav .admin-link.show {
            display: inline-block;
        }
        
        .nav .btn-logout {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }
        
        .nav .btn-logout:hover {
            background: #fecaca;
        }
        
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }
        
        .hamburger span {
            display: block;
            width: 24px;
            height: 3px;
            background: #111827;
            border-radius: 2px;
        }
        
        /* ============================================================
           ORDER LAYOUT
           ============================================================ */
        
        .order-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }
        
        /* ============================================================
           DRUG LIST (left panel)
           ============================================================ */
        
        .drug-list-section {
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .drug-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f3f4f6;
            border-bottom: 2px solid #d1d5db;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .drug-list-header h2 {
            font-size: 16px;
            font-weight: 600;
        }
        
        .drug-list-header .drug-count {
            font-size: 13px;
            color: #6b7280;
        }
        
        /* Search within orders */
        .order-search-row {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .order-search-row input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #d1d5db;
            border-radius: 4px;
            font-size: 14px;
            min-height: 40px;
        }
        
        .order-search-row input:focus {
            border-color: #6b7280;
            outline: none;
        }
        
        .order-search-row button {
            padding: 8px 16px;
            border: 2px solid #d1d5db;
            border-radius: 4px;
            background: #f3f4f6;
            font-size: 13px;
            cursor: pointer;
            min-height: 40px;
        }
        
        .order-search-row button:hover {
            background: #e5e7eb;
        }
        
        /* Drug list - scrollable */
        .drug-list-scroll {
            max-height: 500px;
            overflow-y: auto;
        }
        
        /* List header inside drug list */
        .list-header {
            display: grid;
            grid-template-columns: 2fr 1.2fr 1fr 0.8fr 1fr;
            gap: 6px;
            padding: 8px 14px;
            background: #f9fafb;
            font-weight: 600;
            font-size: 12px;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .list-item {
            display: grid;
            grid-template-columns: 2fr 1.2fr 1fr 0.8fr 1fr;
            gap: 6px;
            padding: 8px 14px;
            border-bottom: 1px solid #f3f4f6;
            font-size: 13px;
            align-items: center;
        }
        
        .list-item:hover {
            background: #f9fafb;
        }
        
        .list-item .drug-name {
            font-weight: 500;
        }
        
        .list-item .drug-form {
            color: #6b7280;
            font-size: 12px;
        }
        
        .list-item .drug-qty {
            font-weight: 500;
        }
        
        .list-item .qty-input {
            width: 55px;
            padding: 4px 6px;
            border: 2px solid #d1d5db;
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
        }
        
        .list-item .qty-input:focus {
            border-color: #6b7280;
            outline: none;
        }
        
        .list-item .add-btn {
            padding: 4px 12px;
            border: 2px solid #d1d5db;
            border-radius: 4px;
            background: #f3f4f6;
            font-size: 12px;
            cursor: pointer;
            min-height: 32px;
        }
        
        .list-item .add-btn:hover {
            background: #e5e7eb;
        }
        
        .list-item .add-btn.added {
            background: #d1fae5;
            border-color: #6ee7b7;
            color: #065f46;
        }
        
        /* Status badge in drug list */
        .status-badge-small {
            padding: 2px 10px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            display: inline-block;
            justify-self: start;
        }
        
        .status-plenty-small {
            background: #d1fae5;
            border-color: #6ee7b7;
            color: #065f46;
        }
        
        .status-okay-small {
            background: #dbeafe;
            border-color: #93c5fd;
            color: #1e3a5f;
        }
        
        .status-low-small {
            background: #fef3c7;
            border-color: #fcd34d;
            color: #92400e;
        }
        
        .status-out-small {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }
        
        /* ============================================================
           ORDER CART (right panel)
           ============================================================ */
        
        .order-cart {
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .order-cart-header {
            padding: 12px 16px;
            background: #f3f4f6;
            border-bottom: 2px solid #d1d5db;
        }
        
        .order-cart-header h2 {
            font-size: 16px;
            font-weight: 600;
        }
        
        .order-cart-header .order-id {
            font-size: 12px;
            color: #6b7280;
            font-weight: normal;
        }
        
        .order-cart-body {
            flex: 1;
            padding: 12px 16px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .cart-empty {
            text-align: center;
            padding: 30px 10px;
            color: #6b7280;
            font-size: 14px;
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 13px;
        }
        
        .cart-item:last-child {
            border-bottom: none;
        }
        
        .cart-item .item-name {
            font-weight: 500;
            flex: 1;
        }
        
        .cart-item .item-qty {
            margin: 0 10px;
            color: #6b7280;
        }
        
        .cart-item .remove-btn {
            background: none;
            border: none;
            color: #991b1b;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }
        
        .cart-item .remove-btn:hover {
            color: #7f1d1d;
        }
        
        .order-cart-footer {
            padding: 12px 16px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .order-cart-footer textarea {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid #d1d5db;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
            resize: vertical;
            min-height: 50px;
        }
        
        .order-cart-footer textarea:focus {
            border-color: #6b7280;
            outline: none;
        }
        
        .order-cart-footer .cart-actions {
            display: flex;
            gap: 8px;
        }
        
        .order-cart-footer .cart-actions button {
            flex: 1;
            padding: 10px;
            border: 2px solid #d1d5db;
            border-radius: 4px;
            background: #f3f4f6;
            font-size: 14px;
            cursor: pointer;
            min-height: 44px;
        }
        
        .order-cart-footer .cart-actions button:hover {
            background: #e5e7eb;
        }
        
        .order-cart-footer .cart-actions .btn-submit {
            background: #1a365d;
            border-color: #1a365d;
            color: #fff;
        }
        
        .order-cart-footer .cart-actions .btn-submit:hover {
            background: #2a4a7a;
        }
        
        .order-cart-footer .cart-actions .btn-cancel {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }
        
        .order-cart-footer .cart-actions .btn-cancel:hover {
            background: #fecaca;
        }
        
        /* ============================================================
           EMPTY / LOADING STATES
           ============================================================ */
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }
        
        .empty-state .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }
        
        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }
        
        .loading-state .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #e5e7eb;
            border-top: 3px solid #6b7280;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* ============================================================
           ALERT
           ============================================================ */
        
        .alert {
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert-error {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }
        
        .alert-success {
            background: #d1fae5;
            border-color: #6ee7b7;
            color: #065f46;
        }
        
        .alert-info {
            background: #dbeafe;
            border-color: #93c5fd;
            color: #1e3a5f;
        }
        
        .alert-warning {
            background: #fef3c7;
            border-color: #fcd34d;
            color: #92400e;
        }
        
        /* ============================================================
           FOOTER
           ============================================================ */
        
        .footer {
            text-align: center;
            padding: 20px 0 8px;
            border-top: 1px solid #e5e7eb;
            margin-top: 24px;
            font-size: 13px;
            color: #6b7280;
        }
        
        /* ============================================================
           RESPONSIVE
           ============================================================ */
        
        @media (max-width: 900px) {
            .order-layout {
                grid-template-columns: 1fr;
            }
            
            .drug-list-scroll {
                max-height: 400px;
            }
        }
        
        @media (max-width: 768px) {
            .list-header {
                grid-template-columns: 1.5fr 1fr 0.8fr 0.7fr 1fr;
                font-size: 11px;
                padding: 6px 10px;
            }
            
            .list-item {
                grid-template-columns: 1.5fr 1fr 0.8fr 0.7fr 1fr;
                font-size: 12px;
                padding: 6px 10px;
            }
            
            .list-item .qty-input {
                width: 45px;
                font-size: 12px;
            }
        }
        
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            
            .header-left {
                justify-content: space-between;
            }
            
            .header-left h1 {
                font-size: 20px;
            }
            
            .hamburger {
                display: flex;
            }
            
            .header-right {
                display: none;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
                width: 100%;
            }
            
            .header-right.open {
                display: flex;
            }
            
            .user-info {
                justify-content: center;
                padding: 8px 0;
                border-bottom: 1px solid #e5e7eb;
            }
            
            .nav {
                flex-direction: column;
                gap: 4px;
            }
            
            .nav a,
            .nav button {
                text-align: center;
                padding: 10px;
                width: 100%;
            }
            
            .order-search-row {
                flex-direction: column;
            }
            
            .list-header {
                display: none;
            }
            
            .list-item {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
                padding: 10px 14px;
            }
            
            .list-item .drug-name {
                font-size: 15px;
                font-weight: 600;
            }
            
            .list-item .drug-form {
                font-size: 13px;
            }
            
            .list-item .drug-row-details {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 6px;
            }
            
            .list-item .drug-qty {
                font-size: 13px;
            }
            
            .list-item .qty-input {
                width: 50px;
            }
            
            .list-item .add-btn {
                padding: 4px 16px;
            }
            
            .order-cart-body {
                max-height: 250px;
            }
            
            .order-cart-footer .cart-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">

        <!-- ============================================================
        HEADER
        ============================================================ -->
        <header class="header">
            <div class="header-left">
                <h1>📝 New Order</h1>
                <button class="hamburger" id="hamburgerBtn" onclick="toggleMenu()" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <div class="header-right" id="headerRight">
                <div class="user-info">
                    <span id="userDisplay">User</span>
                    <span class="role" id="roleDisplay"></span>
                </div>
                <nav class="nav" id="nav">
                    <a href="search.html">Search</a>
                    <a href="orders.html">New Order</a>
                    <a href="myorders.html">My Orders</a>
                    <a href="approve.html" class="admin-link" id="approveLink">Approve</a>
                    <a href="receive.html" class="admin-link" id="receiveLink">Receive</a>
                    <a href="profile.html">Profile</a>
                    <a href="users.html" class="admin-link" id="usersLink">Users</a>
                    <a href="reset.html" class="admin-link" id="resetLink">Reset</a>
                    <button class="btn-logout" onclick="logout()">Logout</button>
                </nav>
            </div>
        </header>

        <!-- ============================================================
        ALERT
        ============================================================ -->
        <div id="alert" class="alert"></div>

        <!-- ============================================================
        ORDER LAYOUT
        ============================================================ -->
        <div class="order-layout">

            <!-- LEFT: DRUG LIST -->
            <div class="drug-list-section">
                <div class="drug-list-header">
                    <h2>💊 Drug List</h2>
                    <span class="drug-count" id="drugCount">0 drugs</span>
                </div>

                <div class="order-search-row">
                    <input type="text" id="drugSearch" placeholder="Search for a drug..." autofocus>
                    <button onclick="searchDrugs()">Search</button>
                    <button onclick="showAllDrugs()">Show All</button>
                </div>

                <div class="drug-list-scroll" id="drugListContainer">
                    <div class="empty-state">
                        <span class="icon">🔍</span>
                        <p>Search for a drug or click Show All</p>
                    </div>
                </div>
            </div>

            <!-- RIGHT: ORDER CART -->
            <div class="order-cart">
                <div class="order-cart-header">
                    <h2>🛒 Order <span class="order-id" id="orderIdDisplay"></span></h2>
                </div>
                <div class="order-cart-body" id="cartContainer">
                    <div class="cart-empty">
                        <p>No items added yet</p>
                        <p style="font-size:12px;color:#9ca3af;">Search and add drugs from the list</p>
                    </div>
                </div>
                <div class="order-cart-footer">
                    <textarea id="orderNotes" placeholder="Add notes for the admin (optional)..."></textarea>
                    <div class="cart-actions">
                        <button class="btn-submit" onclick="submitOrder()">📤 Submit Order</button>
                        <button class="btn-cancel" onclick="clearOrder()">🗑️ Clear</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- ============================================================
        FOOTER
        ============================================================ -->
        <div class="footer">
            <p>Drug Stock Management System</p>
        </div>

    </div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        
        var API_URL = "https://script.google.com/macros/s/AKfycbzHfORUmsdHLH1qVys1kDiYOHDe6hpAHsYMcR4X2nOf-wVA8UhRcVE9ihycw9YDM2vU/exec";

        // ============================================================
        // STATE
        // ============================================================
        
        var allDrugs = [];
        var filteredDrugs = [];
        var cartItems = [];
        var currentUser = {};
        var currentOrderId = '';

        // ============================================================
        // AUTHENTICATION
        // ============================================================

        function checkAuth() {
            if (localStorage.getItem('loggedIn') !== 'true') {
                window.location.href = 'index.html';
                return false;
            }
            return true;
        }

        function getCurrentUser() {
            return {
                userId: localStorage.getItem('userId') || '',
                username: localStorage.getItem('username'),
                fullName: localStorage.getItem('fullName') || localStorage.getItem('username') || 'User',
                firstName: localStorage.getItem('firstName') || '',
                lastName: localStorage.getItem('lastName') || '',
                email: localStorage.getItem('email') || '',
                department: localStorage.getItem('department') || '',
                created: localStorage.getItem('created') || '',
                isAdmin: localStorage.getItem('username') === 'admin'
            };
        }

        function logout() {
            var userId = localStorage.getItem('userId');
            if (userId) {
                fetch(API_URL + '?action=logout&userId=' + encodeURIComponent(userId))
                    .catch(function(error) { console.error('Logout error:', error); });
            }
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // ============================================================
        // ALERT
        // ============================================================

        function showAlert(message, type) {
            var alert = document.getElementById('alert');
            if (!alert) return;
            alert.textContent = message;
            alert.className = 'alert alert-' + type + ' show';
            clearTimeout(alert._timeout);
            alert._timeout = setTimeout(function() {
                alert.classList.remove('show');
            }, 5000);
        }

        // ============================================================
        // MOBILE MENU
        // ============================================================

        function toggleMenu() {
            var headerRight = document.getElementById('headerRight');
            var btn = document.getElementById('hamburgerBtn');
            if (headerRight) headerRight.classList.toggle('open');
            if (btn) btn.classList.toggle('active');
        }

        document.addEventListener('click', function(e) {
            var headerRight = document.getElementById('headerRight');
            var btn = document.getElementById('hamburgerBtn');
            if (headerRight && headerRight.classList.contains('open')) {
                var isInside = headerRight.contains(e.target) || (btn && btn.contains(e.target));
                if (!isInside) {
                    headerRight.classList.remove('open');
                    if (btn) btn.classList.remove('active');
                }
            }
        });

        // ============================================================
        // STOCK LEVEL RULES
        // ============================================================

        function getStockStatus(form, quantity) {
            var formLower = form.toLowerCase().trim();
            
            if (formLower === 'tablet') {
                if (quantity < 50) return { text: 'Low', class: 'status-low-small' };
                else if (quantity >= 50 && quantity <= 200) return { text: 'Okay', class: 'status-okay-small' };
                else return { text: 'Plenty', class: 'status-plenty-small' };
            }
            
            if (formLower === 'bottle' || formLower === 'cream') {
                if (quantity < 3) return { text: 'Low', class: 'status-low-small' };
                else if (quantity >= 3 && quantity <= 5) return { text: 'Okay', class: 'status-okay-small' };
                else return { text: 'Plenty', class: 'status-plenty-small' };
            }
            
            if (quantity < 5) return { text: 'Low', class: 'status-low-small' };
            else if (quantity >= 5 && quantity <= 10) return { text: 'Okay', class: 'status-okay-small' };
            else return { text: 'Plenty', class: 'status-plenty-small' };
        }

        // ============================================================
        // GENERATE ORDER ID
        // ============================================================

        function generateOrderId() {
            var timestamp = Date.now().toString(36).toUpperCase();
            var random = Math.random().toString(36).substring(2, 6).toUpperCase();
            return 'ORD-' + timestamp + '-' + random;
        }

        // ============================================================
        // INITIALIZE PAGE
        // ============================================================

        function initPage() {
            if (!checkAuth()) return;

            currentUser = getCurrentUser();
            var userDisplay = document.getElementById('userDisplay');
            if (userDisplay) userDisplay.textContent = currentUser.fullName;

            var roleDisplay = document.getElementById('roleDisplay');
            if (roleDisplay) roleDisplay.textContent = currentUser.isAdmin ? 'Admin' : 'User';

            var adminLinks = document.querySelectorAll('.admin-link');
            adminLinks.forEach(function(link) {
                if (currentUser.isAdmin) link.classList.add('show');
                else link.classList.remove('show');
            });

            // Admin cannot place orders
            if (currentUser.isAdmin) {
                document.querySelector('.order-layout').innerHTML = 
                    '<div class="empty-state" style="padding:60px 20px;"><span class="icon">🔑</span><p>Admin cannot place orders. Only approver rights.</p></div>';
                return;
            }

            currentOrderId = generateOrderId();
            document.getElementById('orderIdDisplay').textContent = currentOrderId;

            loadAllDrugs();

            var searchBox = document.getElementById('drugSearch');
            if (searchBox) {
                searchBox.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        searchDrugs();
                    }
                });
            }
        }

        // ============================================================
        // LOAD ALL DRUGS
        // ============================================================

        async function loadAllDrugs() {
            var container = document.getElementById('drugListContainer');
            container.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading drugs...</p>
                </div>
            `;

            try {
                var response = await fetch(API_URL + '?search=');
                var results = await response.json();

                allDrugs = results.map(function(item) {
                    return {
                        name: item[0] || 'Unknown',
                        form: item[1] || 'N/A',
                        balance: parseFloat(item[2]) || 0,
                        batch: item[3] || '',
                        expiry: item[4] || ''
                    };
                });

                filteredDrugs = allDrugs;
                renderDrugList();

            } catch (error) {
                console.error('Error loading drugs:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">❌</span>
                        <p>Error loading drugs. Please refresh.</p>
                    </div>
                `;
            }
        }

        // ============================================================
        // SEARCH DRUGS
        // ============================================================

        function searchDrugs() {
            var query = document.getElementById('drugSearch').value.toLowerCase().trim();

            if (!query) {
                showAlert('Please enter a search term.', 'warning');
                return;
            }

            filteredDrugs = allDrugs.filter(function(drug) {
                return drug.name.toLowerCase().indexOf(query) !== -1 ||
                       drug.form.toLowerCase().indexOf(query) !== -1;
            });

            renderDrugList();
        }

        function showAllDrugs() {
            document.getElementById('drugSearch').value = '';
            filteredDrugs = allDrugs;
            renderDrugList();
            showAlert('Showing all drugs.', 'info');
        }

        // ============================================================
        // RENDER DRUG LIST
        // ============================================================

        function renderDrugList() {
            var container = document.getElementById('drugListContainer');
            var count = document.getElementById('drugCount');

            if (filteredDrugs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">🔍</span>
                        <p>No drugs found</p>
                    </div>
                `;
                if (count) count.textContent = '0 drugs';
                return;
            }

            if (count) count.textContent = filteredDrugs.length + ' drugs';

            var html = `
                <div class="list-header">
                    <span>Drug Name</span>
                    <span>Form</span>
                    <span>Qty</span>
                    <span>Status</span>
                    <span>Action</span>
                </div>
            `;

            filteredDrugs.forEach(function(drug, index) {
                var inCart = cartItems.some(function(item) { return item.name === drug.name; });
                var status = getStockStatus(drug.form, drug.balance);
                var isOutOfStock = drug.balance === 0;

                html += `
                    <div class="list-item">
                        <span class="drug-name">${drug.name}</span>
                        <span class="drug-form">${drug.form}</span>
                        <span class="drug-qty">${drug.balance}</span>
                        <span class="status-badge-small ${status.class}">${status.text}</span>
                        <div style="display:flex;gap:4px;align-items:center;">
                            <input type="number" id="qty-${index}" min="1" max="${drug.balance}" value="1" class="qty-input" ${isOutOfStock ? 'disabled' : ''}>
                            <button class="add-btn ${inCart ? 'added' : ''}" onclick="addToCart(${index})" ${isOutOfStock ? 'disabled' : ''}>
                                ${inCart ? '✅' : 'Add'}
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // ADD TO CART
        // ============================================================

        function addToCart(index) {
            var drug = filteredDrugs[index];
            if (!drug) return;

            if (drug.balance === 0) {
                showAlert(drug.name + ' is out of stock.', 'error');
                return;
            }

            var qtyInput = document.getElementById('qty-' + index);
            var qty = parseInt(qtyInput ? qtyInput.value : 1) || 1;

            if (qty < 1) {
                showAlert('Quantity must be at least 1.', 'error');
                return;
            }

            if (qty > drug.balance) {
                showAlert('Quantity exceeds available stock (' + drug.balance + ').', 'error');
                return;
            }

            if (cartItems.some(function(item) { return item.name === drug.name; })) {
                showAlert(drug.name + ' is already in your order.', 'warning');
                return;
            }

            cartItems.push({
                name: drug.name,
                quantity: qty,
                maxStock: drug.balance,
                form: drug.form
            });

            renderCart();
            renderDrugList();
            showAlert('Added ' + drug.name + ' to order.', 'success');
        }

        // ============================================================
        // RENDER CART
        // ============================================================

        function renderCart() {
            var container = document.getElementById('cartContainer');

            if (cartItems.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty">
                        <p>No items added yet</p>
                        <p style="font-size:12px;color:#9ca3af;">Search and add drugs from the list</p>
                    </div>
                `;
                return;
            }

            var html = '';
            cartItems.forEach(function(item, index) {
                html += `
                    <div class="cart-item">
                        <span class="item-name">${item.name}</span>
                        <span class="item-qty">× ${item.quantity}</span>
                        <button class="remove-btn" onclick="removeFromCart(${index})">✕</button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // REMOVE FROM CART
        // ============================================================

        function removeFromCart(index) {
            var removed = cartItems[index].name;
            cartItems.splice(index, 1);
            renderCart();
            renderDrugList();
            showAlert('Removed ' + removed + ' from order.', 'info');
        }

        // ============================================================
        // CLEAR ORDER
        // ============================================================

        function clearOrder() {
            if (cartItems.length === 0) {
                showAlert('Your order is already empty.', 'info');
                return;
            }

            if (!confirm('Clear all items from your order?')) return;

            cartItems = [];
            document.getElementById('orderNotes').value = '';
            renderCart();
            renderDrugList();
            showAlert('Order cleared.', 'info');
        }
