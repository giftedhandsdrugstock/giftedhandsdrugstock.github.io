<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Stock - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <div class="header">
            <h1>Drug Stock Management</h1>
        </div>

        <div id="alert" class="alert"></div>

        <!-- LOGIN -->
        <div id="loginForm">
            <h2>Login</h2>
            <form id="loginFormElement" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>User ID, Username or Email</label>
                    <input type="text" id="loginUsername" placeholder="Enter User ID, Username or Email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p style="margin-top:15px;">Don't have an account? <a href="#" onclick="showRegister()">Register</a></p>
        </div>

        <!-- REGISTER -->
        <div id="registerForm" style="display:none;">
            <h2>Register</h2>
            <form id="registerFormElement" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="regFirstName" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="regLastName" placeholder="Doe" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <div class="form-inline">
                        <input type="text" id="regDepartment" list="departmentList" placeholder="Select or type a department" required>
                        <button type="button" class="btn btn-small" onclick="clearDepartment()">Clear</button>
                    </div>
                    <datalist id="departmentList">
                        <option value="Pharmacy">
                        <option value="Ward A">
                        <option value="Ward B">
                        <option value="Ward C">
                        <option value="Outpatient">
                        <option value="Emergency">
                        <option value="Surgical">
                        <option value="Maternity">
                        <option value="Paediatric">
                        <option value="Private">
                        <option value="Administration">
                        <option value="Laboratory">
                        <option value="Radiology">
                        <option value="Physiotherapy">
                        <option value="Dental">
                        <option value="Optometry">
                        <option value="Nutrition">
                        <option value="Counseling">
                        <option value="Records">
                        <option value="Finance">
                        <option value="HR">
                        <option value="IT">
                        <option value="Maintenance">
                        <option value="Security">
                        <option value="Other">
                    </datalist>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPassword" placeholder="Min 6 characters" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="regConfirmPassword" placeholder="Confirm password" required>
                    </div>
                </div>
                <button type="submit" class="btn">Create Account</button>
            </form>
            <p style="margin-top:15px;">Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('alert').className = 'alert';
            document.getElementById('loginUsername').focus();
        }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('alert').className = 'alert';
            document.getElementById('regFirstName').focus();
        }

        function clearDepartment() {
            document.getElementById('regDepartment').value = '';
            document.getElementById('regDepartment').focus();
        }

        async function handleLogin(event) {
            event.preventDefault();

            var loginId = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value.trim();

            if (!loginId || !password) {
                showAlert('Please enter both username/email and password.', 'error');
                return;
            }

            try {
                var response = await fetch(API_URL +
                    '?action=login' +
                    '&username=' + encodeURIComponent(loginId) +
                    '&password=' + encodeURIComponent(password));

                var result = await response.json();

                if (result.success) {
                    var user = result.user;

                    localStorage.setItem('loggedIn', 'true');
                    localStorage.setItem('userId', user.userId || '');
                    localStorage.setItem('username', user.username);
                    localStorage.setItem('fullName', user.fullName);
                    localStorage.setItem('firstName', user.firstName);
                    localStorage.setItem('lastName', user.lastName);
                    localStorage.setItem('email', user.email);
                    localStorage.setItem('department', user.department);
                    localStorage.setItem('created', user.created || '');

                    showAlert('Welcome, ' + user.fullName + '!', 'success');

                    setTimeout(function() {
                        window.location.href = 'search.html';
                    }, 500);
                } else {
                    showAlert(result.message || 'Invalid credentials.', 'error');
                }

            } catch (error) {
                console.error('Login error:', error);
                showAlert('Error connecting to server.', 'error');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();

            var firstName = document.getElementById('regFirstName').value.trim();
            var lastName = document.getElementById('regLastName').value.trim();
            var email = document.getElementById('regEmail').value.trim();
            var username = document.getElementById('regUsername').value.trim();
            var department = document.getElementById('regDepartment').value.trim();
            var password = document.getElementById('regPassword').value;
            var confirmPassword = document.getElementById('regConfirmPassword').value;

            if (!firstName || !lastName || !email || !username || !department || !password) {
                showAlert('Please fill in all fields.', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Passwords do not match.', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters.', 'error');
                return;
            }

            try {
                var response = await fetch(API_URL +
                    '?action=register' +
                    '&firstName=' + encodeURIComponent(firstName) +
                    '&lastName=' + encodeURIComponent(lastName) +
                    '&email=' + encodeURIComponent(email) +
                    '&username=' + encodeURIComponent(username) +
                    '&department=' + encodeURIComponent(department) +
                    '&password=' + encodeURIComponent(password));

                var result = await response.json();

                if (result.success) {
                    showAlert('Account created! Your User ID: ' + result.userId + '. Please login.', 'success');
                    showLogin();
                    document.getElementById('loginUsername').value = result.userId || username;
                    document.getElementById('loginPassword').focus();
                } else {
                    showAlert(result.message || 'Registration failed.', 'error');
                }

            } catch (error) {
                console.error('Register error:', error);
                showAlert('Error connecting to server.', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('loggedIn') === 'true') {
                window.location.href = 'search.html';
                return;
            }

            setupEnterNavigation(
                document.getElementById('loginFormElement'),
                ['loginUsername', 'loginPassword']
            );

            setupEnterNavigation(
                document.getElementById('registerFormElement'),
                ['regFirstName', 'regLastName', 'regEmail', 'regUsername', 'regDepartment', 'regPassword', 'regConfirmPassword']
            );

            document.getElementById('loginUsername').focus();
        });
    </script>

</body>
</html>
