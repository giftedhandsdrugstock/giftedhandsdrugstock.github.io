<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Stock Search</title>
    <style>
        /* ============================================================
           RESET
           ============================================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            padding: 20px;
        }
        
        .app-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }
        
        /* ============================================================
           HEADER
           ============================================================ */
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 2px solid #e5e7eb;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .header-left h1 {
            font-size: 24px;
            font-weight: 700;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        
        .user-info .role {
            color: #6b7280;
            font-size: 12px;
        }
        
        .nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .nav a,
        .nav button {
            padding: 6px 14px;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            text-decoration: none;
            color: #111827;
            font-size: 14px;
            cursor: pointer;
        }
        
        .nav a:hover,
        .nav button:hover {
            background: #e5e7eb;
        }
        
        .nav .admin-link {
            display: none;
        }
        
        .nav .admin-link.show {
            display: inline-block;
        }
        
        .nav .btn-logout {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }
        
        .nav .btn-logout:hover {
            background: #fecaca;
        }
        
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }
        
        .hamburger span {
            display: block;
            width: 24px;
            height: 3px;
            background: #111827;
            border-radius: 2px;
        }
        
        /* ============================================================
           SEARCH
           ============================================================ */
        
        .search-section {
            margin-bottom: 20px;
        }
        
        .search-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .search-row input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
            min-height: 44px;
        }
        
        .search-row input:focus {
            border-color: #6b7280;
            outline: none;
        }
        
        .search-row button {
            padding: 10px 20px;
            border: 2px solid #d1d5db;
            border-radius: 6px;
            background: #f3f4f6;
            font-size: 14px;
            cursor: pointer;
            min-height: 44px;
        }
        
        .search-row button:hover {
            background: #e5e7eb;
        }
        
        /* ============================================================
           RESULTS - LIST VIEW
           ============================================================ */
        
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            overflow: hidden;
        }
        
        /* Header row */
        .list-header {
            display: grid;
            grid-template-columns: 3fr 1.5fr 1.5fr 1.5fr;
            gap: 8px;
            padding: 10px 14px;
            background: #f3f4f6;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 2px solid #d1d5db;
        }
        
        /* Drug row */
        .list-item {
            display: grid;
            grid-template-columns: 3fr 1.5fr 1.5fr 1.5fr;
            gap: 8px;
            padding: 10px 14px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
            align-items: center;
        }
        
        .list-item:last-child {
            border-bottom: none;
        }
        
        .list-item:hover {
            background: #f9fafb;
        }
        
        .list-item .drug-name {
            font-weight: 500;
        }
        
        .list-item .drug-form {
            color: #6b7280;
        }
        
        .list-item .drug-qty {
            font-weight: 500;
        }
        
        /* ============================================================
           STATUS BADGE - WITH PADDING LIKE NAV BUTTONS
           ============================================================ */
        
        .status-badge {
            padding: 6px 14px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            display: inline-block;
            justify-self: start;
            min-width: 70px;
        }
        
        /* Status colors */
        .status-plenty {
            background: #d1fae5;
            border-color: #6ee7b7;
            color: #065f46;
        }
        
        .status-okay {
            background: #dbeafe;
            border-color: #93c5fd;
            color: #1e3a5f;
        }
        
        .status-low {
            background: #fef3c7;
            border-color: #fcd34d;
            color: #92400e;
        }
        
        .status-out {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }
        
        /* ============================================================
           EMPTY / LOADING STATES
           ============================================================ */
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
            border: 1px dashed #d1d5db;
            border-radius: 6px;
        }
        
        .empty-state .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }
        
        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }
        
        .loading-state .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #e5e7eb;
            border-top: 3px solid #6b7280;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* ============================================================
           ALERT
           ============================================================ */
        
        .alert {
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert-error {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }
        
        .alert-success {
            background: #d1fae5;
            border-color: #6ee7b7;
            color: #065f46;
        }
        
        .alert-info {
            background: #dbeafe;
            border-color: #93c5fd;
            color: #1e3a5f;
        }
        
        /* ============================================================
           FOOTER
           ============================================================ */
        
        .footer {
            text-align: center;
            padding: 20px 0 8px;
            border-top: 1px solid #e5e7eb;
            margin-top: 24px;
            font-size: 13px;
            color: #6b7280;
        }
        
        /* ============================================================
           RESPONSIVE
           ============================================================ */
        
        /* TABLET */
        @media (max-width: 768px) {
            .list-header {
                grid-template-columns: 2fr 1.5fr 1fr 1.5fr;
                font-size: 12px;
            }
            
            .list-item {
                grid-template-columns: 2fr 1.5fr 1fr 1.5fr;
                font-size: 13px;
                padding: 8px 12px;
            }
            
            .status-badge {
                padding: 4px 10px;
                font-size: 12px;
                min-width: 60px;
            }
        }
        
        /* MOBILE */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            
            /* Header */
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            
            .header-left {
                justify-content: space-between;
            }
            
            .header-left h1 {
                font-size: 20px;
            }
            
            .hamburger {
                display: flex;
            }
            
            .header-right {
                display: none;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
                width: 100%;
            }
            
            .header-right.open {
                display: flex;
            }
            
            .user-info {
                justify-content: center;
                padding: 8px 0;
                border-bottom: 1px solid #e5e7eb;
            }
            
            .nav {
                flex-direction: column;
                gap: 4px;
            }
            
            .nav a,
            .nav button {
                text-align: center;
                padding: 10px;
                width: 100%;
            }
            
            /* Search */
            .search-row {
                flex-direction: column;
                gap: 8px;
            }
            
            .search-row input {
                width: 100%;
                font-size: 16px;
            }
            
            .search-row button {
                width: 100%;
            }
            
            /* Results - Mobile list */
            .list-header {
                display: none;
            }
            
            .list-item {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
                padding: 12px 14px;
                border-bottom: 1px solid #e5e7eb;
            }
            
            .list-item:last-child {
                border-bottom: none;
            }
            
            .list-item .drug-name {
                font-size: 16px;
                font-weight: 600;
            }
            
            .list-item .drug-form {
                font-size: 14px;
                color: #6b7280;
            }
            
            .list-item .drug-details-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 4px;
            }
            
            .list-item .drug-qty {
                font-size: 14px;
            }
            
            .status-badge {
                padding: 6px 14px;
                font-size: 13px;
                min-width: 70px;
            }
            
            .results-list {
                border: none;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">

        <!-- ============================================================
        HEADER
        ============================================================ -->
        <header class="header">
            <div class="header-left">
                <h1>Drug Stock</h1>
                <button class="hamburger" id="hamburgerBtn" onclick="toggleMenu()" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <div class="header-right" id="headerRight">
                <div class="user-info">
                    <span id="userDisplay">User</span>
                    <span class="role" id="roleDisplay"></span>
                </div>
                <nav class="nav" id="nav">
                    <a href="search.html">Search</a>
                    <a href="orders.html">New Order</a>
                    <a href="myorders.html">My Orders</a>
                    <a href="approve.html" class="admin-link" id="approveLink">Approve</a>
                    <a href="receive.html" class="admin-link" id="receiveLink">Receive</a>
                    <a href="profile.html">Profile</a>
                    <a href="users.html" class="admin-link" id="usersLink">Users</a>
                    <a href="reset.html" class="admin-link" id="resetLink">Reset</a>
                    <button class="btn-logout" onclick="logout()">Logout</button>
                </nav>
            </div>
        </header>

        <!-- ============================================================
        ALERT
        ============================================================ -->
        <div id="alert" class="alert"></div>

        <!-- ============================================================
        SEARCH
        ============================================================ -->
        <section class="search-section">
            <div class="search-row">
                <input type="text" id="searchBox" placeholder="Search for a drug..." autofocus>
                <button onclick="searchDrugs()">Search</button>
                <button onclick="clearSearch()">Clear</button>
            </div>
        </section>

        <!-- ============================================================
        RESULTS - LIST VIEW
        ============================================================ -->
        <div id="results">
            <div class="empty-state">
                <span class="icon">🔍</span>
                <p>Type a drug name and click Search</p>
            </div>
        </div>

        <!-- ============================================================
        FOOTER
        ============================================================ -->
        <div class="footer">
            <p>Drug Stock Management System</p>
        </div>

    </div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        
        var API_URL = "https://script.google.com/macros/s/AKfycbzHfORUmsdHLH1qVys1kDiYOHDe6hpAHsYMcR4X2nOf-wVA8UhRcVE9ihycw9YDM2vU/exec";

        // ============================================================
        // AUTHENTICATION
        // ============================================================

        function checkAuth() {
            if (localStorage.getItem('loggedIn') !== 'true') {
                window.location.href = 'index.html';
                return false;
            }
            return true;
        }

        function getCurrentUser() {
            return {
                userId: localStorage.getItem('userId') || '',
                username: localStorage.getItem('username'),
                fullName: localStorage.getItem('fullName') || localStorage.getItem('username') || 'User',
                firstName: localStorage.getItem('firstName') || '',
                lastName: localStorage.getItem('lastName') || '',
                email: localStorage.getItem('email') || '',
                department: localStorage.getItem('department') || '',
                created: localStorage.getItem('created') || '',
                isAdmin: localStorage.getItem('username') === 'admin'
            };
        }

        function logout() {
            var userId = localStorage.getItem('userId');
            if (userId) {
                fetch(API_URL + '?action=logout&userId=' + encodeURIComponent(userId))
                    .catch(function(error) { console.error('Logout error:', error); });
            }
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // ============================================================
        // ALERT
        // ============================================================

        function showAlert(message, type) {
            var alert = document.getElementById('alert');
            if (!alert) return;
            alert.textContent = message;
            alert.className = 'alert alert-' + type + ' show';
            clearTimeout(alert._timeout);
            alert._timeout = setTimeout(function() {
                alert.classList.remove('show');
            }, 5000);
        }

        // ============================================================
        // MOBILE MENU
        // ============================================================

        function toggleMenu() {
            var headerRight = document.getElementById('headerRight');
            var btn = document.getElementById('hamburgerBtn');
            if (headerRight) {
                headerRight.classList.toggle('open');
            }
            if (btn) {
                btn.classList.toggle('active');
            }
        }

        document.addEventListener('click', function(e) {
            var headerRight = document.getElementById('headerRight');
            var btn = document.getElementById('hamburgerBtn');
            if (headerRight && headerRight.classList.contains('open')) {
                var isInside = headerRight.contains(e.target) || (btn && btn.contains(e.target));
                if (!isInside) {
                    headerRight.classList.remove('open');
                    if (btn) btn.classList.remove('active');
                }
            }
        });

        // ============================================================
        // INITIALIZE PAGE
        // ============================================================

        function initPage() {
            if (!checkAuth()) return;

            var user = getCurrentUser();
            var userDisplay = document.getElementById('userDisplay');
            if (userDisplay) {
                userDisplay.textContent = user.fullName;
            }

            var roleDisplay = document.getElementById('roleDisplay');
            if (roleDisplay) {
                roleDisplay.textContent = user.isAdmin ? 'Admin' : 'User';
            }

            var adminLinks = document.querySelectorAll('.admin-link');
            adminLinks.forEach(function(link) {
                if (user.isAdmin) {
                    link.classList.add('show');
                } else {
                    link.classList.remove('show');
                }
            });

            var searchBox = document.getElementById('searchBox');
            if (searchBox) {
                searchBox.focus();
                searchBox.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        searchDrugs();
                    }
                });
            }
        }

        // ============================================================
        // STOCK LEVEL RULES
        // ============================================================

        function getStockStatus(form, quantity) {
            // Normalize form to lowercase for comparison
            var formLower = form.toLowerCase().trim();
            
            // RULE 1: Tablet
            if (formLower === 'tablet') {
                if (quantity < 50) {
                    return { text: 'Low', class: 'status-low' };
                } else if (quantity >= 50 && quantity <= 200) {
                    return { text: 'Okay', class: 'status-okay' };
                } else {
                    return { text: 'Plenty', class: 'status-plenty' };
                }
            }
            
            // RULE 2: Bottle or Cream
            if (formLower === 'bottle' || formLower === 'cream') {
                if (quantity < 3) {
                    return { text: 'Low', class: 'status-low' };
                } else if (quantity >= 3 && quantity <= 5) {
                    return { text: 'Okay', class: 'status-okay' };
                } else {
                    return { text: 'Plenty', class: 'status-plenty' };
                }
            }
            
            // RULE 3: Default (everything else)
            if (quantity < 5) {
                return { text: 'Low', class: 'status-low' };
            } else if (quantity >= 5 && quantity <= 10) {
                return { text: 'Okay', class: 'status-okay' };
            } else {
                return { text: 'Plenty', class: 'status-plenty' };
            }
        }

        // ============================================================
        // SEARCH DRUGS - LIST VIEW
        // ============================================================

        async function searchDrugs() {
            var query = document.getElementById('searchBox').value.trim();

            if (!query) {
                document.getElementById('results').innerHTML = `
                    <div class="empty-state">
                        <span class="icon">🔍</span>
                        <p>Type a drug name and click Search</p>
                    </div>
                `;
                return;
            }

            // Show loading
            document.getElementById('results').innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Searching...</p>
                </div>
            `;

            try {
                var response = await fetch(API_URL + '?search=' + encodeURIComponent(query));
                var results = await response.json();

                if (!results || results.length === 0) {
                    document.getElementById('results').innerHTML = `
                        <div class="empty-state">
                            <span class="icon">🔍</span>
                            <p>No matching drugs found for "<strong>${query}</strong>"</p>
                        </div>
                    `;
                    return;
                }

                // Build list
                var html = `<div class="results-list">`;
                
                // Desktop header
                html += `
                    <div class="list-header">
                        <span>Drug Name</span>
                        <span>Form</span>
                        <span>Quantity</span>
                        <span>Status</span>
                    </div>
                `;

                // List items
                results.forEach(function(record) {
                    var name = record[0] || 'Unknown';
                    var form = record[1] || 'N/A';
                    var balance = parseFloat(record[2]) || 0;
                    var status = getStockStatus(form, balance);

                    html += `
                        <div class="list-item">
                            <span class="drug-name">${name}</span>
                            <span class="drug-form">${form}</span>
                            <span class="drug-qty">${balance}</span>
                            <span class="status-badge ${status.class}">${status.text}</span>
                        </div>
                    `;
                });

                html += `</div>`;
                document.getElementById('results').innerHTML = html;

            } catch (error) {
                console.error('Search error:', error);
                document.getElementById('results').innerHTML = `
                    <div class="empty-state">
                        <span class="icon">❌</span>
                        <p>Unable to retrieve stock information</p>
                    </div>
                `;
            }
        }

        // ============================================================
        // CLEAR SEARCH
        // ============================================================

        function clearSearch() {
            var searchBox = document.getElementById('searchBox');
            if (searchBox) {
                searchBox.value = '';
                searchBox.focus();
            }
            document.getElementById('results').innerHTML = `
                <div class="empty-state">
                    <span class="icon">🔍</span>
                    <p>Type a drug name and click Search</p>
                </div>
            `;
        }

        // ============================================================
        // INIT ON LOAD
        // ============================================================

        document.addEventListener('DOMContentLoaded', function() {
            initPage();
        });
    </script>

</body>
</html>
