<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Stock Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header"></div>

    <!-- ===== PAGE CONTENT ===== -->
    <div class="section-box">
        <div class="search-box">
            <input type="text" id="searchBox" placeholder="Search for a drug...">
        </div>

        <div id="results">
            <p class="text-muted">Type a drug name and press Enter.</p>
        </div>
    </div>

    <div id="footer"></div>

    <script>
        // ============================================================
        // LOAD HEADER AND FOOTER
        // ============================================================

        fetch('header.html')
            .then(function(r) { return r.text(); })
            .then(function(html) {
                document.getElementById('header').innerHTML = html;
                return fetch('footer.html');
            })
            .then(function(r) { return r.text(); })
            .then(function(html) {
                document.getElementById('footer').innerHTML = html;
                // Load script.js after header and footer are loaded
                var script = document.createElement('script');
                script.src = 'script.js';
                document.body.appendChild(script);
            })
            .catch(function(error) {
                console.error('Error loading header/footer:', error);
            });

        // ============================================================
        // PAGE INIT
        // ============================================================

        function initPage() {
            if (typeof checkAuth !== 'function') return;

            if (!checkAuth()) return;

            var user = getCurrentUser();
            var userDisplay = document.getElementById('userDisplay');
            if (userDisplay) userDisplay.textContent = 'Welcome, ' + user.fullName;

            var roleDisplay = document.getElementById('roleDisplay');
            if (roleDisplay) roleDisplay.textContent = user.isAdmin ? '(Admin)' : '(User)';

            var deptDisplay = document.getElementById('deptDisplay');
            if (deptDisplay) deptDisplay.textContent = 'Department: ' + user.department;

            if (typeof initNav === 'function') initNav();

            var searchBox = document.getElementById('searchBox');
            if (searchBox) {
                searchBox.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        searchDrugs();
                    }
                });
                searchBox.focus();
            }
        }

        // ============================================================
        // SEARCH DRUGS
        // ============================================================

        async function searchDrugs() {
            var query = document.getElementById('searchBox').value.trim();

            if (!query) {
                document.getElementById('results').innerHTML = '<p class="text-muted">Type a drug name and press Enter.</p>';
                return;
            }

            var resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Searching...</p>';
            if (typeof showLoading === 'function') showLoading('Searching for: ' + query);

            try {
                var response = await fetch(API_URL + '?search=' + encodeURIComponent(query));
                var results = await response.json();
                if (typeof hideLoading === 'function') hideLoading();

                if (results.length === 0) {
                    resultsDiv.innerHTML = '<p>No matching drugs found.</p>';
                    return;
                }

                var html = '<table><tr><th>Drug Name</th><th>Form</th><th>Balance</th></tr>';
                results.forEach(function(record) {
                    var balance = parseFloat(record[2]) || 0;
                    html += '<tr>';
                    html += '<td>' + record[0] + '</td>';
                    html += '<td>' + record[1] + '</td>';
                    html += '<td>' + balance + '</td>';
                    html += '</tr>';
                });
                html += '</table>';
                resultsDiv.innerHTML = html;

            } catch (error) {
                if (typeof hideLoading === 'function') hideLoading();
                console.error('Search error:', error);
                resultsDiv.innerHTML = '<p>Unable to retrieve stock information.</p>';
            }
        }
    </script>

</body>
</html>
