<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Stock - Search</title>
</head>
<body>

    <div id="app">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ccc;padding-bottom:10px;">
            <h1>Drug Stock Search</h1>
            <div>
                <span id="userDisplay" style="margin-right:15px;"></span>
                <span id="roleDisplay" style="margin-right:15px;font-size:12px;color:#666;"></span>
                <a href="movement.html">Movement</a>
                <a href="users.html" id="usersLink" style="margin-left:10px;display:none;">Users</a>
                <button onclick="logout()" style="margin-left:10px;">Logout</button>
            </div>
        </div>

        <div style="margin:20px 0;">
            <input type="text" id="searchBox" placeholder="Search for a drug..." style="width:100%;padding:12px;font-size:18px;">
        </div>

        <div id="results">
            <p>Type a drug name and press Enter.</p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwlcUEZ9hWV1TPF2Fv5a1k8pJUqZ8cZ2R5QI4lAhogADGHVzsOsgvv3TEmQkSHFJkx1/exec";

        function checkAuth() {
            if (localStorage.getItem('loggedIn') !== 'true') {
                window.location.href = 'index.html';
                return;
            }

            const username = localStorage.getItem('username');
            const fullName = localStorage.getItem('fullName') || localStorage.getItem('username') || 'User';
            const isAdmin = username === 'admin';

            document.getElementById('userDisplay').textContent = 'Welcome, ' + fullName;
            document.getElementById('roleDisplay').textContent = isAdmin ? '(Admin)' : '(User)';

            // Show Users link only for admin
            if (isAdmin) {
                document.getElementById('usersLink').style.display = 'inline';
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function searchDrugs() {
            const query = document.getElementById('searchBox').value.trim();

            if (!query) {
                document.getElementById('results').innerHTML = '<p>Type a drug name and press Enter.</p>';
                return;
            }

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Searching...</p>';

            try {
                const response = await fetch(API_URL + '?search=' + encodeURIComponent(query));
                const results = await response.json();

                if (results.length === 0) {
                    resultsDiv.innerHTML = '<p>No matching drugs found.</p>';
                    return;
                }

                let html = '<table border="1" cellpadding="6" cellspacing="0" style="width:100%;border-collapse:collapse;">';
                html += '<tr><th>Drug Name</th><th>Form</th><th>Balance</th></tr>';

                results.forEach(function(record) {
                    const balance = parseFloat(record[2]) || 0;
                    html += '<tr>';
                    html += '<td>' + record[0] + '</td>';
                    html += '<td>' + record[1] + '</td>';
                    html += '<td>' + balance + '</td>';
                    html += '</tr>';
                });

                html += '</table>';
                resultsDiv.innerHTML = html;

            } catch (error) {
                console.error('Search error:', error);
                resultsDiv.innerHTML = '<p>Unable to retrieve stock information.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();

            const searchBox = document.getElementById('searchBox');
            searchBox.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    searchDrugs();
                }
            });

            searchBox.focus();
        });
    </script>

</body>
</html>
