<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Stock - Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">

        <div class="header">
            <h1>Drug Stock Search</h1>
            <div class="header-right">
                <span id="userDisplay"></span>
                <span id="roleDisplay" class="role-badge"></span>
                <span id="deptDisplay" class="dept-badge"></span>
                <a href="users.html" id="usersLink" style="display:none;">Users</a>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchBox" placeholder="Search for a drug...">
        </div>

        <div id="results">
            <p class="text-muted">Type a drug name and press Enter.</p>
        </div>

    </div>

    <script src="script.js"></script>
    <script>
        // ============================================================
        // SEARCH.HTML SPECIFIC
        // ============================================================

        function initSearch() {
            if (!checkAuth()) return;

            const user = getCurrentUser();
            document.getElementById('userDisplay').textContent = 'Welcome, ' + user.fullName;
            document.getElementById('roleDisplay').textContent = user.isAdmin ? '(Admin)' : '(User)';
            document.getElementById('deptDisplay').textContent = '🏢 ' + user.department;

            if (user.isAdmin) {
                document.getElementById('usersLink').style.display = 'inline';
            }
        }

        async function searchDrugs() {
            const query = document.getElementById('searchBox').value.trim();

            if (!query) {
                document.getElementById('results').innerHTML = '<p class="text-muted">Type a drug name and press Enter.</p>';
                return;
            }

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Searching...</p>';

            try {
                const response = await fetch(API_URL + '?search=' + encodeURIComponent(query));
                const results = await response.json();

                if (results.length === 0) {
                    resultsDiv.innerHTML = '<p>No matching drugs found.</p>';
                    return;
                }

                let html = '<table><tr><th>Drug Name</th><th>Form</th><th>Balance</th></tr>';
                results.forEach(function(record) {
                    const balance = parseFloat(record[2]) || 0;
                    html += '<tr>';
                    html += '<td>' + record[0] + '</td>';
                    html += '<td>' + record[1] + '</td>';
                    html += '<td>' + balance + '</td>';
                    html += '</tr>';
                });
                html += '</table>';
                resultsDiv.innerHTML = html;

            } catch (error) {
                console.error('Search error:', error);
                resultsDiv.innerHTML = '<p>Unable to retrieve stock information.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initSearch();
            setupSearchEnter('searchBox', searchDrugs);
            document.getElementById('searchBox').focus();
        });
    </script>

</body>
</html>
