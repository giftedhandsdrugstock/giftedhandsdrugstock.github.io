<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Drug Stock Search</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ============================================================
           BASE STYLES
           ============================================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f7fafc;
            padding: 16px;
            min-height: 100vh;
        }
        
        /* ============================================================
           HEADER
           ============================================================ */
        
        .app-header {
            background: #1a365d;
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        
        .app-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .app-header-top h1 {
            font-size: 20px;
            font-weight: 600;
        }
        
        .app-header-top h1 span {
            font-size: 24px;
        }
        
        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            background: rgba(255,255,255,0.15);
            padding: 6px 12px;
            border-radius: 20px;
        }
        
        .user-badge .role {
            font-size: 11px;
            opacity: 0.7;
        }
        
        /* Hamburger */
        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }
        
        .hamburger span {
            display: block;
            width: 22px;
            height: 2.5px;
            background: #fff;
            border-radius: 2px;
            transition: all 0.3s;
        }
        
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }
        
        /* Navigation */
        .mobile-nav {
            display: none;
            flex-direction: column;
            gap: 4px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .mobile-nav.open {
            display: flex;
        }
        
        .mobile-nav a,
        .mobile-nav button {
            padding: 10px 14px;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            background: rgba(255,255,255,0.05);
            border: none;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .mobile-nav a:hover,
        .mobile-nav button:hover {
            background: rgba(255,255,255,0.15);
        }
        
        .mobile-nav .admin-link {
            display: none;
        }
        
        .mobile-nav .admin-link.show {
            display: block;
        }
        
        .mobile-nav .btn-logout {
            color: #feb2b2;
            margin-top: 4px;
        }
        
        .mobile-nav .btn-logout:hover {
            background: rgba(254, 178, 178, 0.15);
        }
        
        /* ============================================================
           SEARCH BAR
           ============================================================ */
        
        .search-section {
            margin-bottom: 16px;
        }
        
        .search-wrapper {
            display: flex;
            gap: 8px;
            background: #fff;
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .search-wrapper input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: transparent;
            min-height: 48px;
        }
        
        .search-wrapper input:focus {
            outline: none;
        }
        
        .search-wrapper input::placeholder {
            color: #a0aec0;
        }
        
        .search-wrapper button {
            padding: 10px 18px;
            background: #2b6cb0;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            min-height: 48px;
            min-width: 60px;
            transition: background 0.2s;
        }
        
        .search-wrapper button:hover {
            background: #1a4a7a;
        }
        
        .search-wrapper button.btn-clear {
            background: #e2e8f0;
            color: #4a5568;
            min-width: 50px;
        }
        
        .search-wrapper button.btn-clear:hover {
            background: #cbd5e0;
        }
        
        /* ============================================================
           RESULTS - CARD LAYOUT
           ============================================================ */
        
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .result-card {
            background: #fff;
            border-radius: 12px;
            padding: 16px 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 4px solid #2b6cb0;
            transition: transform 0.15s, box-shadow 0.15s;
            animation: fadeInUp 0.3s ease;
        }
        
        .result-card:active {
            transform: scale(0.98);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .result-card .drug-name {
            font-size: 17px;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 2px;
        }
        
        .result-card .drug-form {
            font-size: 14px;
            color: #718096;
            margin-bottom: 8px;
        }
        
        .result-card .drug-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid #edf2f7;
        }
        
        .result-card .drug-quantity {
            font-size: 15px;
            color: #2d3748;
        }
        
        .result-card .drug-quantity strong {
            font-weight: 600;
            color: #1a202c;
        }
        
        .result-card .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .result-card .status-badge.in-stock {
            background: #c6f6d5;
            color: #276749;
        }
        
        .result-card .status-badge.low-stock {
            background: #fefcbf;
            color: #975a16;
        }
        
        .result-card .status-badge.out-of-stock {
            background: #fed7d7;
            color: #9b2c2c;
        }
        
        /* Status by border color */
        .result-card.border-in-stock {
            border-left-color: #38a169;
        }
        
        .result-card.border-low-stock {
            border-left-color: #d69e2e;
        }
        
        .result-card.border-out-of-stock {
            border-left-color: #e53e3e;
        }
        
        /* Empty / loading states */
        .empty-state,
        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: #a0aec0;
        }
        
        .empty-state .icon,
        .loading-state .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }
        
        .loading-state .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #2b6cb0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* ============================================================
           ALERT
           ============================================================ */
        
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: none;
            font-size: 14px;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert-success {
            background: #c6f6d5;
            color: #276749;
            border: 1px solid #9ae6b4;
        }
        
        .alert-error {
            background: #fed7d7;
            color: #9b2c2c;
            border: 1px solid #feb2b2;
        }
        
        .alert-info {
            background: #bee3f8;
            color: #2a4365;
            border: 1px solid #90cdf4;
        }
        
        .alert-warning {
            background: #fefcbf;
            color: #975a16;
            border: 1px solid #f6e05e;
        }
        
        /* ============================================================
           FOOTER
           ============================================================ */
        
        .app-footer {
            text-align: center;
            padding: 20px 0 8px;
            font-size: 12px;
            color: #a0aec0;
        }
        
        /* ============================================================
           RESPONSIVE - TABLET AND DESKTOP
           ============================================================ */
        
        @media (min-width: 600px) {
            body {
                padding: 24px 32px;
                max-width: 800px;
                margin: 0 auto;
            }
            
            .app-header {
                padding: 20px 24px;
            }
            
            .app-header-top h1 {
                font-size: 24px;
            }
            
            .results-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            
            .result-card {
                padding: 18px 20px;
            }
        }
        
        @media (min-width: 900px) {
            body {
                padding: 32px 40px;
                max-width: 1000px;
            }
            
            .results-container {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 14px;
            }
        }
        
        /* ============================================================
           DARK MODE SUPPORT (optional)
           ============================================================ */
        
        @media (prefers-color-scheme: dark) {
            body {
                background: #1a202c;
            }
            
            .app-header {
                background: #2d3748;
            }
            
            .search-wrapper {
                background: #2d3748;
            }
            
            .search-wrapper input {
                color: #e2e8f0;
            }
            
            .search-wrapper input::placeholder {
                color: #718096;
            }
            
            .result-card {
                background: #2d3748;
                border-left-color: #4a5568;
            }
            
            .result-card .drug-name {
                color: #f7fafc;
            }
            
            .result-card .drug-form {
                color: #a0aec0;
            }
            
            .result-card .drug-details {
                border-top-color: #4a5568;
            }
            
            .result-card .drug-quantity {
                color: #e2e8f0;
            }
            
            .result-card .drug-quantity strong {
                color: #f7fafc;
            }
            
            .empty-state,
            .loading-state {
                color: #718096;
            }
            
            .app-footer {
                color: #4a5568;
            }
            
            .search-wrapper button.btn-clear {
                background: #4a5568;
                color: #e2e8f0;
            }
            
            .search-wrapper button.btn-clear:hover {
                background: #5a6578;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <header class="app-header">
        <div class="app-header-top">
            <h1><span>💊</span> Drug Stock</h1>
            <div style="display:flex;align-items:center;gap:8px;">
                <div class="user-badge">
                    <span id="userDisplay">User</span>
                    <span class="role" id="roleDisplay"></span>
                </div>
                <button class="hamburger" id="hamburgerBtn" onclick="toggleMenu()" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
        <nav class="mobile-nav" id="mobileNav">
            <a href="search.html">🔍 Search</a>
            <a href="orders.html">📝 New Order</a>
            <a href="myorders.html">📋 My Orders</a>
            <a href="approve.html" class="admin-link" id="approveLink">✅ Approve</a>
            <a href="receive.html" class="admin-link" id="receiveLink">📥 Receive</a>
            <a href="profile.html">👤 Profile</a>
            <a href="users.html" class="admin-link" id="usersLink">👥 Users</a>
            <a href="reset.html" class="admin-link" id="resetLink">🔄 Reset</a>
            <button class="btn-logout" onclick="logout()">🚪 Logout</button>
        </nav>
    </header>

    <!-- ============================================================
    ALERT
    ============================================================ -->
    <div id="alert" class="alert"></div>

    <!-- ============================================================
    SEARCH
    ============================================================ -->
    <section class="search-section">
        <div class="search-wrapper">
            <input type="text" id="searchBox" placeholder="Search for a drug..." autofocus>
            <button onclick="searchDrugs()">Search</button>
            <button class="btn-clear" onclick="clearSearch()">✕</button>
        </div>
    </section>

    <!-- ============================================================
    RESULTS
    ============================================================ -->
    <div class="results-container" id="results">
        <div class="empty-state">
            <span class="icon">🔍</span>
            <p>Type a drug name and tap Search</p>
        </div>
    </div>

    <!-- ============================================================
    FOOTER
    ============================================================ -->
    <div class="app-footer">
        <p>Drug Stock Management System &bull; v2.0</p>
    </div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        
        var API_URL = "https://script.google.com/macros/s/AKfycbzHfORUmsdHLH1qVys1kDiYOHDe6hpAHsYMcR4X2nOf-wVA8UhRcVE9ihycw9YDM2vU/exec";

        // ============================================================
        // AUTHENTICATION
        // ============================================================

        function checkAuth() {
            if (localStorage.getItem('loggedIn') !== 'true') {
                window.location.href = 'index.html';
                return false;
            }
            return true;
        }

        function getCurrentUser() {
            return {
                userId: localStorage.getItem('userId') || '',
                username: localStorage.getItem('username'),
                fullName: localStorage.getItem('fullName') || localStorage.getItem('username') || 'User',
                firstName: localStorage.getItem('firstName') || '',
                lastName: localStorage.getItem('lastName') || '',
                email: localStorage.getItem('email') || '',
                department: localStorage.getItem('department') || '',
                created: localStorage.getItem('created') || '',
                isAdmin: localStorage.getItem('username') === 'admin'
            };
        }

        function logout() {
            var userId = localStorage.getItem('userId');
            if (userId) {
                fetch(API_URL + '?action=logout&userId=' + encodeURIComponent(userId))
                    .catch(function(error) { console.error('Logout error:', error); });
            }
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // ============================================================
        // ALERT
        // ============================================================

        function showAlert(message, type) {
            var alert = document.getElementById('alert');
            if (!alert) return;
            alert.textContent = message;
            alert.className = 'alert alert-' + type + ' show';
            clearTimeout(alert._timeout);
            alert._timeout = setTimeout(function() {
                alert.classList.remove('show');
            }, 5000);
        }

        // ============================================================
        // MOBILE MENU
        // ============================================================

        function toggleMenu() {
            var nav = document.getElementById('mobileNav');
            var btn = document.getElementById('hamburgerBtn');
            if (nav) nav.classList.toggle('open');
            if (btn) btn.classList.toggle('active');
        }

        document.addEventListener('click', function(e) {
            var nav = document.getElementById('mobileNav');
            var btn = document.getElementById('hamburgerBtn');
            if (nav && nav.classList.contains('open')) {
                var isNavClick = nav.contains(e.target);
                var isBtnClick = btn && btn.contains(e.target);
                if (!isNavClick && !isBtnClick) {
                    nav.classList.remove('open');
                    if (btn) btn.classList.remove('active');
                }
            }
        });

        // ============================================================
        // INITIALIZE PAGE
        // ============================================================

        function initPage() {
            if (!checkAuth()) return;

            var user = getCurrentUser();
            var userDisplay = document.getElementById('userDisplay');
            if (userDisplay) {
                userDisplay.textContent = user.fullName;
            }

            var roleDisplay = document.getElementById('roleDisplay');
            if (roleDisplay) {
                roleDisplay.textContent = user.isAdmin ? 'Admin' : 'User';
            }

            // Show/hide admin links
            var adminLinks = document.querySelectorAll('.admin-link');
            adminLinks.forEach(function(link) {
                if (user.isAdmin) {
                    link.classList.add('show');
                } else {
                    link.classList.remove('show');
                }
            });

            var searchBox = document.getElementById('searchBox');
            if (searchBox) {
                searchBox.focus();
                searchBox.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        searchDrugs();
                    }
                });
            }
        }

        // ============================================================
        // GET STATUS EMOJI AND CLASS
        // ============================================================

        function getStatusInfo(balance) {
            if (balance === 0) {
                return {
                    emoji: '🚫',
                    text: 'Out of Stock',
                    class: 'out-of-stock',
                    borderClass: 'border-out-of-stock'
                };
            } else if (balance < 10) {
                return {
                    emoji: '⚠️',
                    text: 'Low Stock',
                    class: 'low-stock',
                    borderClass: 'border-low-stock'
                };
            } else {
                return {
                    emoji: '✅',
                    text: 'In Stock',
                    class: 'in-stock',
                    borderClass: 'border-in-stock'
                };
            }
        }

        // ============================================================
        // SEARCH DRUGS - CARD RESULTS
        // ============================================================

        async function searchDrugs() {
            var query = document.getElementById('searchBox').value.trim();

            if (!query) {
                document.getElementById('results').innerHTML = `
                    <div class="empty-state">
                        <span class="icon">🔍</span>
                        <p>Type a drug name and tap Search</p>
                    </div>
                `;
                return;
            }

            // Show loading
            document.getElementById('results').innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Searching for "${query}"...</p>
                </div>
            `;

            try {
                var response = await fetch(API_URL + '?search=' + encodeURIComponent(query));
                var results = await response.json();

                if (!results || results.length === 0) {
                    document.getElementById('results').innerHTML = `
                        <div class="empty-state">
                            <span class="icon">🔍</span>
                            <p>No matching drugs found for <strong>"${query}"</strong></p>
                            <p style="font-size:13px;color:#a0aec0;margin-top:4px;">Try a different search term</p>
                        </div>
                    `;
                    return;
                }

                var html = '';
                results.forEach(function(record) {
                    var name = record[0] || 'Unknown';
                    var form = record[1] || 'N/A';
                    var balance = parseFloat(record[2]) || 0;
                    var status = getStatusInfo(balance);

                    html += `
                        <div class="result-card ${status.borderClass}">
                            <div class="drug-name">${name}</div>
                            <div class="drug-form">${form}</div>
                            <div class="drug-details">
                                <span class="drug-quantity">📦 <strong>${balance}</strong></span>
                                <span class="status-badge ${status.class}">${status.emoji} ${status.text}</span>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('results').innerHTML = html;

            } catch (error) {
                console.error('Search error:', error);
                document.getElementById('results').innerHTML = `
                    <div class="empty-state">
                        <span class="icon">❌</span>
                        <p>Unable to retrieve stock information</p>
                        <p style="font-size:13px;color:#a0aec0;margin-top:4px;">Please check your connection and try again</p>
                    </div>
                `;
            }
        }

        // ============================================================
        // CLEAR SEARCH
        // ============================================================

        function clearSearch() {
            var searchBox = document.getElementById('searchBox');
            if (searchBox) {
                searchBox.value = '';
                searchBox.focus();
            }
            document.getElementById('results').innerHTML = `
                <div class="empty-state">
                    <span class="icon">🔍</span>
                    <p>Type a drug name and tap Search</p>
                </div>
            `;
        }

        // ============================================================
        // INIT ON LOAD
        // ============================================================

        document.addEventListener('DOMContentLoaded', function() {
            initPage();
        });
    </script>

</body>
</html>
