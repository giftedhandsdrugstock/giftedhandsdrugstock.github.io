<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER PLACEHOLDER -->
    <div id="header"></div>

    <!-- ===== PAGE CONTENT ===== -->
    <!-- PROFILE INFO -->
    <div class="section-box">
        <h2>Profile Information</h2>
        <form id="profileForm" onsubmit="updateProfile(event)">
            <div class="form-row">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="profileUserId" disabled>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="profileUsername" disabled>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="profileFirstName" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="profileLastName" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="profileEmail" required>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="profileDepartment" list="profileDeptList" required>
                    <datalist id="profileDeptList">
                        <option value="Pharmacy">
                        <option value="Ward A">
                        <option value="Ward B">
                        <option value="Ward C">
                        <option value="Outpatient">
                        <option value="Emergency">
                        <option value="Surgical">
                        <option value="Maternity">
                        <option value="Paediatric">
                        <option value="Private">
                        <option value="Administration">
                        <option value="Other">
                    </datalist>
                </div>
            </div>
            <div class="form-group">
                <label>Account Created</label>
                <input type="text" id="profileCreated" disabled>
            </div>
            <button type="submit" class="btn">Update Profile</button>
        </form>
    </div>

    <!-- CHANGE PASSWORD -->
    <div class="section-box">
        <h2>Change Password</h2>
        <form id="passwordForm" onsubmit="changePassword(event)">
            <div class="form-row">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Min 6 characters" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" placeholder="Confirm password" required>
                </div>
            </div>
            <button type="submit" class="btn">Change Password</button>
        </form>
    </div>

    <!-- SESSION INFO -->
    <div class="section-box">
        <h2>Session Information</h2>
        <div style="display:flex;flex-wrap:wrap;gap:20px;">
            <div>
                <strong>Logged in as:</strong>
                <span id="sessionUser"></span>
            </div>
            <div>
                <strong>Department:</strong>
                <span id="sessionDept"></span>
            </div>
            <div>
                <strong>User ID:</strong>
                <span id="sessionUserId" style="font-family:monospace;font-size:13px;"></span>
            </div>
        </div>
    </div>

    <!-- FOOTER PLACEHOLDER -->
    <div id="footer"></div>

    <script>
        // ============================================================
        // LOAD HEADER AND FOOTER, THEN INITIALIZE
        // ============================================================

        var headerLoaded = false;
        var footerLoaded = false;

        function checkReady() {
            if (headerLoaded && footerLoaded) {
                var script = document.createElement('script');
                script.src = 'script.js';
                script.onload = function() {
                    if (typeof initPage === 'function') {
                        initPage();
                    }
                };
                document.body.appendChild(script);
            }
        }

        fetch('header.html')
            .then(function(response) { return response.text(); })
            .then(function(html) {
                document.getElementById('header').innerHTML = html;
                headerLoaded = true;
                checkReady();
            })
            .catch(function(error) {
                console.error('Error loading header:', error);
                headerLoaded = true;
                checkReady();
            });

        fetch('footer.html')
            .then(function(response) { return response.text(); })
            .then(function(html) {
                document.getElementById('footer').innerHTML = html;
                footerLoaded = true;
                checkReady();
            })
            .catch(function(error) {
                console.error('Error loading footer:', error);
                footerLoaded = true;
                checkReady();
            });

        // ============================================================
        // PROFILE.HTML SPECIFIC
        // ============================================================

        function initPage() {
            if (!checkAuth()) return;

            var user = getCurrentUser();
            var userDisplay = document.getElementById('userDisplay');
            if (userDisplay) userDisplay.textContent = 'Welcome, ' + user.fullName;

            var roleDisplay = document.getElementById('roleDisplay');
            if (roleDisplay) roleDisplay.textContent = user.isAdmin ? '(Admin)' : '(User)';

            if (typeof initNav === 'function') initNav();

            var userId = document.getElementById('profileUserId');
            var username = document.getElementById('profileUsername');
            var firstName = document.getElementById('profileFirstName');
            var lastName = document.getElementById('profileLastName');
            var email = document.getElementById('profileEmail');
            var department = document.getElementById('profileDepartment');
            var created = document.getElementById('profileCreated');
            var sessionUser = document.getElementById('sessionUser');
            var sessionDept = document.getElementById('sessionDept');
            var sessionUserId = document.getElementById('sessionUserId');

            if (userId) userId.value = user.userId || 'N/A';
            if (username) username.value = user.username;
            if (firstName) firstName.value = user.firstName;
            if (lastName) lastName.value = user.lastName;
            if (email) email.value = user.email;
            if (department) department.value = user.department;
            if (created) created.value = user.created || 'Unknown';

            if (sessionUser) sessionUser.textContent = user.fullName;
            if (sessionDept) sessionDept.textContent = user.department;
            if (sessionUserId) sessionUserId.textContent = user.userId || 'N/A';
        }

        // ============================================================
        // UPDATE PROFILE
        // ============================================================

        async function updateProfile(event) {
            event.preventDefault();

            if (typeof showLoading === 'function') showLoading('Updating profile...');

            var firstName = document.getElementById('profileFirstName').value.trim();
            var lastName = document.getElementById('profileLastName').value.trim();
            var email = document.getElementById('profileEmail').value.trim();
            var department = document.getElementById('profileDepartment').value.trim();
            var username = localStorage.getItem('username');

            if (!firstName || !lastName || !email || !department) {
                if (typeof hideLoading === 'function') hideLoading();
                if (typeof showAlert === 'function') showAlert('All fields are required.', 'error');
                return;
            }

            try {
                var url = API_URL +
                    '?action=updateprofile' +
                    '&username=' + encodeURIComponent(username) +
                    '&firstName=' + encodeURIComponent(firstName) +
                    '&lastName=' + encodeURIComponent(lastName) +
                    '&email=' + encodeURIComponent(email) +
                    '&department=' + encodeURIComponent(department);

                var response = await fetch(url);
                var result = await response.json();

                if (typeof hideLoading === 'function') hideLoading();

                if (result.success) {
                    localStorage.setItem('fullName', firstName + ' ' + lastName);
                    localStorage.setItem('firstName', firstName);
                    localStorage.setItem('lastName', lastName);
                    localStorage.setItem('email', email);
                    localStorage.setItem('department', department);

                    if (typeof showAlert === 'function') showAlert('Profile updated successfully!', 'success');

                    var fullName = firstName + ' ' + lastName;
                    var userDisplay = document.getElementById('userDisplay');
                    var sessionUser = document.getElementById('sessionUser');
                    var sessionDept = document.getElementById('sessionDept');

                    if (userDisplay) userDisplay.textContent = 'Welcome, ' + fullName;
                    if (sessionUser) sessionUser.textContent = fullName;
                    if (sessionDept) sessionDept.textContent = department;

                } else {
                    if (typeof showAlert === 'function') showAlert(result.message || 'Error updating profile.', 'error');
                }

            } catch (error) {
                if (typeof hideLoading === 'function') hideLoading();
                console.error('Update error:', error);
                if (typeof showAlert === 'function') showAlert('Error connecting to server.', 'error');
            }
        }

        // ============================================================
        // CHANGE PASSWORD
        // ============================================================

        async function changePassword(event) {
            event.preventDefault();

            if (typeof showLoading === 'function') showLoading('Changing password...');

            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmPassword) {
                if (typeof hideLoading === 'function') hideLoading();
                if (typeof showAlert === 'function') showAlert('Passwords do not match.', 'error');
                return;
            }

            if (newPassword.length < 6) {
                if (typeof hideLoading === 'function') hideLoading();
                if (typeof showAlert === 'function') showAlert('Password must be at least 6 characters.', 'error');
                return;
            }

            var username = localStorage.getItem('username');

            try {
                var response = await fetch(API_URL +
                    '?action=updateprofile' +
                    '&username=' + encodeURIComponent(username) +
                    '&password=' + encodeURIComponent(newPassword));

                var result = await response.json();

                if (typeof hideLoading === 'function') hideLoading();

                if (result.success) {
                    if (typeof showAlert === 'function') showAlert('Password changed successfully!', 'success');
                    var passwordForm = document.getElementById('passwordForm');
                    if (passwordForm) passwordForm.reset();
                } else {
                    if (typeof showAlert === 'function') showAlert(result.message || 'Error changing password.', 'error');
                }

            } catch (error) {
                if (typeof hideLoading === 'function') hideLoading();
                console.error('Password error:', error);
                if (typeof showAlert === 'function') showAlert('Error connecting to server.', 'error');
            }
        }
    </script>

</body>
</html>
