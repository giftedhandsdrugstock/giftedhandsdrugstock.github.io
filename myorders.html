<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER PLACEHOLDER -->
    <div id="header"></div>

    <!-- ===== PAGE CONTENT ===== -->
    <!-- SEARCH SECTION -->
    <div class="section-box">
        <div class="flex flex-wrap gap-10" style="align-items:center;">
            <div style="flex:1;min-width:150px;">
                <input type="text" id="orderSearch" placeholder="Search by Order ID..." style="width:100%;padding:6px 8px;border:1px solid #ccc;">
            </div>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                <label>From:</label>
                <input type="date" id="dateFrom" style="padding:6px 8px;border:1px solid #ccc;">
                <label>To:</label>
                <input type="date" id="dateTo" style="padding:6px 8px;border:1px solid #ccc;">
            </div>
            <button class="btn" onclick="searchOrders()">Search</button>
            <button class="btn" onclick="clearSearch()">Clear</button>
            <button class="btn" id="toggleViewBtn" onclick="toggleView()">📅 Show All Orders</button>
        </div>
        <div style="margin-top:10px;font-size:13px;color:#888;">
            <span id="viewLabel">Showing: Today's Orders</span>
            <span style="margin-left:15px;" id="resultCount">0 orders found</span>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="orders-main" style="display:flex;gap:20px;">

        <!-- LEFT PANEL -->
        <div class="left-panel" style="flex:1;min-width:0;">
            <div class="section-box">
                <h2>Order List</h2>
                <div id="orderListContainer">
                    <p class="text-muted">No orders found.</p>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel" style="flex:1;min-width:0;">
            <div class="section-box">
                <h2>Order Details</h2>
                <div id="orderDetailsContainer">
                    <p class="text-muted">Select an order to view details.</p>
                </div>
            </div>
        </div>

    </div>

    <!-- FOOTER PLACEHOLDER -->
    <div id="footer"></div>

    <script>
        // ============================================================
        // LOAD HEADER AND FOOTER, THEN INITIALIZE
        // ============================================================

        var headerLoaded = false;
        var footerLoaded = false;

        function checkReady() {
            if (headerLoaded && footerLoaded) {
                var script = document.createElement('script');
                script.src = 'script.js';
                script.onload = function() {
                    if (typeof initPage === 'function') {
                        initPage();
                    }
                };
                document.body.appendChild(script);
            }
        }

        fetch('header.html')
            .then(function(response) { return response.text(); })
            .then(function(html) {
                document.getElementById('header').innerHTML = html;
                headerLoaded = true;
                checkReady();
            })
            .catch(function(error) {
                console.error('Error loading header:', error);
                headerLoaded = true;
                checkReady();
            });

        fetch('footer.html')
            .then(function(response) { return response.text(); })
            .then(function(html) {
                document.getElementById('footer').innerHTML = html;
                footerLoaded = true;
                checkReady();
            })
            .catch(function(error) {
                console.error('Error loading footer:', error);
                footerLoaded = true;
                checkReady();
            });

        // ============================================================
        // MYORDERS.HTML SPECIFIC
        // ============================================================

        var allOrders = [];
        var filteredOrders = [];
        var selectedOrderId = null;
        var showAllOrders = false;

        // ============================================================
        // INIT
        // ============================================================

        function initPage() {
            if (!checkAuth()) return;

            var user = getCurrentUser();
            var userDisplay = document.getElementById('userDisplay');
            if (userDisplay) userDisplay.textContent = 'Welcome, ' + user.fullName;

            var roleDisplay = document.getElementById('roleDisplay');
            if (roleDisplay) roleDisplay.textContent = user.isAdmin ? '(Admin)' : '(User)';

            if (typeof initNav === 'function') initNav();

            loadAllOrders();

            // Set up search enter key
            var orderSearch = document.getElementById('orderSearch');
            if (orderSearch) {
                orderSearch.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        searchOrders();
                    }
                });
            }
        }

        // ============================================================
        // LOAD ALL ORDERS
        // ============================================================

        async function loadAllOrders() {
            var container = document.getElementById('orderListContainer');
            if (container) container.innerHTML = '<p class="text-muted">Loading orders...</p>';

            var user = getCurrentUser();

            try {
                var url = API_URL + '?action=getorders&user=' + encodeURIComponent(user.username);

                var response = await fetch(url);
                var results = await response.json();

                allOrders = results;
                applyViewFilter();

            } catch (error) {
                console.error('Error loading orders:', error);
                if (container) container.innerHTML = '<p class="text-muted">Error loading orders.</p>';
                if (typeof showAlert === 'function') showAlert('Error loading orders.', 'error');
            }
        }

        // ============================================================
        // TOGGLE VIEW
        // ============================================================

        function toggleView() {
            showAllOrders = !showAllOrders;
            var btn = document.getElementById('toggleViewBtn');
            var label = document.getElementById('viewLabel');

            if (showAllOrders) {
                if (btn) btn.textContent = '📅 Show Today';
                if (label) label.textContent = 'Showing: All Orders';
            } else {
                if (btn) btn.textContent = '📅 Show All Orders';
                if (label) label.textContent = 'Showing: Today\'s Orders';
            }

            var dateFrom = document.getElementById('dateFrom');
            var dateTo = document.getElementById('dateTo');
            var orderSearch = document.getElementById('orderSearch');
            if (dateFrom) dateFrom.value = '';
            if (dateTo) dateTo.value = '';
            if (orderSearch) orderSearch.value = '';

            applyViewFilter();
        }

        // ============================================================
        // APPLY VIEW FILTER
        // ============================================================

        function applyViewFilter() {
            var today = new Date();
            today.setHours(0, 0, 0, 0);

            var filtered = allOrders.filter(function(order) {
                var orderDate = new Date(order.timestamp);

                if (showAllOrders) {
                    return true;
                } else {
                    return orderDate >= today;
                }
            });

            filteredOrders = filtered;
            renderOrderList(filteredOrders);
            updateResultCount();

            selectedOrderId = null;
            var detailsContainer = document.getElementById('orderDetailsContainer');
            if (detailsContainer) detailsContainer.innerHTML = '<p class="text-muted">Select an order to view details.</p>';
        }

        // ============================================================
        // SEARCH ORDERS
        // ============================================================

        function searchOrders() {
            var searchTerm = document.getElementById('orderSearch').value.toLowerCase().trim();
            var dateFrom = document.getElementById('dateFrom').value;
            var dateTo = document.getElementById('dateTo').value;

            var today = new Date();
            today.setHours(0, 0, 0, 0);

            var baseFiltered = allOrders.filter(function(order) {
                var orderDate = new Date(order.timestamp);

                if (showAllOrders) {
                    return true;
                } else {
                    return orderDate >= today;
                }
            });

            var filtered = baseFiltered.filter(function(order) {
                var match = true;

                if (searchTerm) {
                    match = match && order.orderId.toLowerCase().indexOf(searchTerm) !== -1;
                }

                if (dateFrom) {
                    var orderDate = new Date(order.timestamp);
                    var fromDate = new Date(dateFrom);
                    match = match && orderDate >= fromDate;
                }

                if (dateTo) {
                    var orderDate = new Date(order.timestamp);
                    var toDate = new Date(dateTo + 'T23:59:59');
                    match = match && orderDate <= toDate;
                }

                return match;
            });

            filteredOrders = filtered;
            renderOrderList(filtered);
            updateResultCount();

            selectedOrderId = null;
            var detailsContainer = document.getElementById('orderDetailsContainer');
            if (detailsContainer) detailsContainer.innerHTML = '<p class="text-muted">Select an order to view details.</p>';
        }

        // ============================================================
        // CLEAR SEARCH
        // ============================================================

        function clearSearch() {
            var orderSearch = document.getElementById('orderSearch');
            var dateFrom = document.getElementById('dateFrom');
            var dateTo = document.getElementById('dateTo');

            if (orderSearch) orderSearch.value = '';
            if (dateFrom) dateFrom.value = '';
            if (dateTo) dateTo.value = '';
            applyViewFilter();

            if (typeof showAlert === 'function') showAlert('Search cleared.', 'info');
        }

        // ============================================================
        // UPDATE RESULT COUNT
        // ============================================================

        function updateResultCount() {
            var count = document.getElementById('resultCount');
            if (count) count.textContent = filteredOrders.length + ' order(s) found';
        }

        // ============================================================
        // RENDER ORDER LIST
        // ============================================================

        function renderOrderList(orders) {
            var container = document.getElementById('orderListContainer');

            if (!container) return;

            if (orders.length === 0) {
                container.innerHTML = '<p class="text-muted">No orders found.</p>';
                return;
            }

            var html = '';

            orders.forEach(function(order) {
                var date = order.timestamp ? new Date(order.timestamp).toLocaleDateString() : 'Unknown';
                var time = order.timestamp ? new Date(order.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                var itemCount = order.items ? order.items.length : 0;
                var statusColor = getStatusColor(order.status);
                var isSelected = selectedOrderId === order.orderId ? 'style="background:#e8f0fe;border-left:3px solid #2b6cb0;"' : '';

                html += `
                    <div class="order-list-item" onclick="selectOrder('${order.orderId}')" ${isSelected} style="padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer;transition:background 0.2s;border-left:3px solid transparent;">
                        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px;">
                            <div>
                                <strong style="font-size:14px;">${order.orderId}</strong>
                                <span style="font-size:12px;color:#888;margin-left:10px;">${date} ${time}</span>
                            </div>
                            <span style="color:${statusColor};font-weight:bold;font-size:13px;">${order.status.toUpperCase()}</span>
                        </div>
                        <div style="font-size:12px;color:#888;margin-top:4px;">
                            ${itemCount} item(s) · ${order.department || 'N/A'}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // SELECT ORDER
        // ============================================================

        function selectOrder(orderId) {
            selectedOrderId = orderId;

            var items = document.querySelectorAll('.order-list-item');
            items.forEach(function(item) {
                item.style.background = '';
                item.style.borderLeft = '3px solid transparent';
            });

            var selectedItem = document.querySelector('.order-list-item[onclick="selectOrder(\'' + orderId + '\')"]');
            if (selectedItem) {
                selectedItem.style.background = '#e8f0fe';
                selectedItem.style.borderLeft = '3px solid #2b6cb0';
            }

            var order = allOrders.find(function(o) { return o.orderId === orderId; });
            if (order) {
                renderOrderDetails(order);
            }
        }

        // ============================================================
        // RENDER ORDER DETAILS
        // ============================================================

        function renderOrderDetails(order) {
            var container = document.getElementById('orderDetailsContainer');

            if (!container) return;

            var date = order.timestamp ? new Date(order.timestamp).toLocaleString() : 'Unknown';
            var statusColor = getStatusColor(order.status);

            var itemsHtml = '';
            if (order.items && order.items.length > 0) {
                itemsHtml = '<table style="width:100%;margin-top:10px;">';
                itemsHtml += '<tr><th>Drug</th><th>Quantity</th></tr>';
                order.items.forEach(function(item) {
                    itemsHtml += '<tr>';
                    itemsHtml += '<td>' + item.drug + '</td>';
                    itemsHtml += '<td style="text-align:center;">' + item.quantity + '</td>';
                    itemsHtml += '</tr>';
                });
                itemsHtml += '</table>';
            } else {
                itemsHtml = '<p class="text-muted">No items in this order.</p>';
            }

            var statusLabel = order.status.charAt(0).toUpperCase() + order.status.slice(1);

            var html = `
                <div style="margin-bottom:15px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                        <h3 style="font-weight:normal;font-size:18px;">${order.orderId}</h3>
                        <span style="color:${statusColor};font-weight:bold;font-size:16px;">${statusLabel}</span>
                    </div>
                    <div style="margin-top:10px;font-size:14px;color:#555;">
                        <div><strong>Date:</strong> ${date}</div>
                        <div><strong>Department:</strong> ${order.department || 'N/A'}</div>
                        <div><strong>Requested By:</strong> ${order.username || 'Unknown'}</div>
                        <div><strong>Approved By:</strong> ${order.approvedBy || 'Pending'}</div>
                        ${order.notes ? `<div><strong>Notes:</strong> ${order.notes}</div>` : ''}
                    </div>
                </div>
                <hr style="border:none;border-top:1px solid #eee;">
                <div style="margin-top:10px;">
                    <strong>Items:</strong>
                    ${itemsHtml}
                </div>
            `;

            container.innerHTML = html;
        }

        // ============================================================
        // HELPERS
        // ============================================================

        function getStatusColor(status) {
            var colors = {
                'pending': '#d69e2e',
                'approved': '#38a169',
                'rejected': '#e53e3e',
                'completed': '#2b6cb0'
            };
            return colors[status] || '#666';
        }
    </script>

</body>
</html>
