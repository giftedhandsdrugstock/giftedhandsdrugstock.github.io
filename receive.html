<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receive Stock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER PLACEHOLDER -->
    <div id="header"></div>

    <!-- ===== PAGE CONTENT ===== -->
    <!-- SEARCH SECTION -->
    <div class="section-box">
        <div class="flex flex-wrap gap-10" style="align-items:center;">
            <div style="flex:1;min-width:200px;">
                <input type="text" id="drugSearch" placeholder="Search by drug name or form..." style="width:100%;padding:6px 8px;border:1px solid #ccc;">
            </div>
            <button class="btn" onclick="searchDrugs()">Search</button>
            <button class="btn" onclick="clearSearch()">Clear</button>
            <button class="btn" id="toggleDrugsBtn" onclick="toggleDrugList()">Show All Drugs</button>
            <button class="btn" id="newReceiveBtn" onclick="toggleNewReceive()">➕ New Receive</button>
            <button class="btn" onclick="showNewDrugModal()" style="background:#805ad5;color:white;border:none;">➕ New Drug (Bulk)</button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="orders-main" style="display:flex;gap:20px;">

        <!-- LEFT PANEL - 2/3 (hidden by default) -->
        <div class="left-panel" style="flex:2;min-width:0;display:none;" id="drugListPanel">
            <div class="section-box">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
                    <h2>Drug List</h2>
                    <div>
                        <span id="drugCount" class="text-muted"></span>
                        <button id="closeDrugListBtn" onclick="closeDrugList()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#999;margin-left:10px;" title="Close Drug List">✕</button>
                    </div>
                </div>
                <div id="drugListContainer">
                    <p class="text-muted">No drugs found.</p>
                </div>
                <div id="pagination" style="display:none;margin-top:15px;gap:10px;align-items:center;flex-wrap:wrap;">
                    <button class="btn btn-small" onclick="prevPage()">◀ Previous</button>
                    <span id="pageInfo" class="text-muted"></span>
                    <button class="btn btn-small" onclick="nextPage()">Next ▶</button>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL - 1/3 (hidden by default) -->
        <div class="right-panel" style="flex:1;min-width:0;display:none;" id="receivePanel">
            <div class="section-box">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
                    <h2>New Receive</h2>
                    <div>
                        <span id="receiveIdDisplay" class="text-muted" style="font-size:13px;"></span>
                        <button onclick="toggleNewReceive()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#999;margin-left:10px;" title="Close Receive Panel">✕</button>
                    </div>
                </div>

                <!-- Supplier & Invoice -->
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <div style="flex:1;min-width:100px;">
                        <label style="font-size:13px;font-weight:500;">Supplier</label>
                        <input type="text" id="receiveSupplier" placeholder="Supplier name" style="width:100%;padding:6px 8px;border:1px solid #ccc;border-radius:4px;">
                    </div>
                    <div style="flex:1;min-width:100px;">
                        <label style="font-size:13px;font-weight:500;">Invoice No</label>
                        <input type="text" id="receiveInvoice" placeholder="Invoice number" style="width:100%;padding:6px 8px;border:1px solid #ccc;border-radius:4px;">
                    </div>
                </div>

                <div id="receiveListContainer" style="margin-top:10px;">
                    <p class="text-muted">No items added yet. Search and add drugs.</p>
                </div>
                <div style="margin-top:15px;border-top:1px solid #eee;padding-top:12px;">
                    <label style="font-weight:500;font-size:14px;display:block;margin-bottom:4px;">📝 Additional Notes</label>
                    <textarea id="receiveNotes" placeholder="Add any additional notes..." style="width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:4px;font-size:14px;font-family:inherit;resize:vertical;min-height:50px;"></textarea>
                </div>
                <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
                    <button class="btn" onclick="submitReceive()" style="background:#38a169;color:white;border:none;">📥 Receive Stock</button>
                    <button class="btn" onclick="clearReceive()" style="color:#c00;">🗑️ Cancel Receive</button>
                </div>
            </div>
        </div>

    </div>

    <!-- ============================================================
    NEW DRUG MODAL - BULK ENTRY
    ============================================================ -->
    <div id="newDrugModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;">
        <div style="background:#fff;padding:30px;border-radius:8px;max-width:800px;width:95%;max-height:90vh;overflow-y:auto;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
                <h2 style="font-weight:normal;">Add New Drugs (Bulk)</h2>
                <button onclick="closeNewDrugModal()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;">✕</button>
            </div>
            <p class="text-muted" style="margin-bottom:15px;">Add multiple new drugs at once. All fields are required for each drug.</p>

            <!-- Supplier & Invoice for New Drugs -->
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px;padding:10px;background:#f7fafc;border-radius:4px;">
                <div style="flex:1;min-width:150px;">
                    <label style="font-size:13px;font-weight:500;">Supplier</label>
                    <input type="text" id="newDrugSupplier" placeholder="Supplier name" style="width:100%;padding:6px 8px;border:1px solid #ccc;border-radius:4px;">
                </div>
                <div style="flex:1;min-width:150px;">
                    <label style="font-size:13px;font-weight:500;">Invoice No</label>
                    <input type="text" id="newDrugInvoice" placeholder="Invoice number" style="width:100%;padding:6px 8px;border:1px solid #ccc;border-radius:4px;">
                </div>
                <div style="flex:1;min-width:150px;">
                    <label style="font-size:13px;font-weight:500;">Received By</label>
                    <input type="text" id="newDrugReceivedBy" placeholder="Received by" style="width:100%;padding:6px 8px;border:1px solid #ccc;border-radius:4px;">
                </div>
            </div>

            <!-- Drug Entry Table -->
            <div style="overflow-x:auto;">
                <table id="newDrugTable" style="width:100%;border-collapse:collapse;font-size:14px;">
                    <thead>
                        <tr style="background:#f0f0f0;">
                            <th style="padding:8px;text-align:left;border:1px solid #ddd;">Drug Name <span style="color:#c00;">*</span></th>
                            <th style="padding:8px;text-align:left;border:1px solid #ddd;">Form <span style="color:#c00;">*</span></th>
                            <th style="padding:8px;text-align:left;border:1px solid #ddd;">Batch No <span style="color:#c00;">*</span></th>
                            <th style="padding:8px;text-align:left;border:1px solid #ddd;">Expiry <span style="color:#c00;">*</span></th>
                            <th style="padding:8px;text-align:center;border:1px solid #ddd;width:80px;">Qty <span style="color:#c00;">*</span></th>
                            <th style="padding:8px;text-align:center;border:1px solid #ddd;width:50px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="newDrugTableBody">
                        <!-- Rows added dynamically -->
                    </tbody>
                </table>
            </div>

            <!-- Add Row Button -->
            <div style="margin-top:10px;">
                <button class="btn" onclick="addNewDrugRow()" style="background:#2b6cb0;color:white;border:none;">➕ Add Row</button>
                <button class="btn" onclick="removeLastDrugRow()" style="color:#c00;">✕ Remove Last</button>
            </div>

            <!-- Notes -->
            <div style="margin-top:15px;">
                <label style="font-weight:500;font-size:14px;display:block;margin-bottom:4px;">📝 Notes (for all drugs)</label>
                <textarea id="newDrugNotes" placeholder="Additional notes..." style="width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:4px;font-size:14px;font-family:inherit;resize:vertical;min-height:50px;"></textarea>
            </div>

            <div style="display:flex;gap:10px;margin-top:15px;">
                <button class="btn" onclick="submitNewDrugs()" style="background:#38a169;color:white;border:none;">💾 Add All Drugs & Receive</button>
                <button class="btn" onclick="closeNewDrugModal()" style="color:#c00;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- FOOTER PLACEHOLDER -->
    <div id="footer"></div>

    <script>
        // ============================================================
        // LOAD HEADER AND FOOTER, THEN INITIALIZE
        // ============================================================

        var headerLoaded = false;
        var footerLoaded = false;

        function checkReady() {
            if (headerLoaded && footerLoaded) {
                var script = document.createElement('script');
                script.src = 'script.js';
                script.onload = function() {
                    if (typeof initPage === 'function') {
                        initPage();
                    }
                };
                document.body.appendChild(script);
            }
        }

        fetch('header.html')
            .then(function(response) { return response.text(); })
            .then(function(html) {
                document.getElementById('header').innerHTML = html;
                headerLoaded = true;
                checkReady();
            })
            .catch(function(error) {
                console.error('Error loading header:', error);
                headerLoaded = true;
                checkReady();
            });

        fetch('footer.html')
            .then(function(response) { return response.text(); })
            .then(function(html) {
                document.getElementById('footer').innerHTML = html;
                footerLoaded = true;
                checkReady();
            })
            .catch(function(error) {
                console.error('Error loading footer:', error);
                footerLoaded = true;
                checkReady();
            });

        // ============================================================
        // RECEIVE.HTML SPECIFIC
        // ============================================================

        var allDrugs = [];
        var filteredDrugs = [];
        var currentPage = 1;
        var pageSize = 10;
        var receiveItems = [];
        var currentUser = {};
        var isDrugListVisible = false;
        var isReceiveOpen = false;
        var currentReceiveId = '';
        var newDrugRowCount = 0;

        // ============================================================
        // GENERATE RECEIVE ID
        // ============================================================

        function generateReceiveId() {
            var timestamp = Date.now().toString(36).toUpperCase();
            var random = Math.random().toString(36).substring(2, 6).toUpperCase();
            return 'RCV-' + timestamp + '-' + random;
        }

        // ============================================================
        // INIT
        // ============================================================

        function initPage() {
            if (!checkAuth()) return;

            currentUser = getCurrentUser();
            var userDisplay = document.getElementById('userDisplay');
            if (userDisplay) userDisplay.textContent = 'Welcome, ' + currentUser.fullName;

            var roleDisplay = document.getElementById('roleDisplay');
            if (roleDisplay) roleDisplay.textContent = currentUser.isAdmin ? '(Admin)' : '(User)';

            if (typeof initNav === 'function') initNav();

            if (!currentUser.isAdmin) {
                var searchSection = document.querySelector('.section-box:first-of-type');
                if (searchSection) searchSection.style.display = 'none';
                var drugListPanel = document.getElementById('drugListPanel');
                if (drugListPanel) drugListPanel.style.display = 'none';
                var receivePanel = document.getElementById('receivePanel');
                if (receivePanel) receivePanel.style.display = 'none';
                if (typeof showAlert === 'function') showAlert('Admin access required for receiving stock.', 'info');
                return;
            }

            loadDrugsSilent();

            var drugSearch = document.getElementById('drugSearch');
            if (drugSearch) {
                drugSearch.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        searchDrugs();
                    }
                });
            }
        }

        // ============================================================
        // NEW DRUG MODAL FUNCTIONS
        // ============================================================

        function showNewDrugModal() {
            var modal = document.getElementById('newDrugModal');
            if (modal) {
                modal.style.display = 'flex';
                document.getElementById('newDrugTableBody').innerHTML = '';
                newDrugRowCount = 0;
                for (var i = 0; i < 3; i++) {
                    addNewDrugRow();
                }
            }
        }

        function closeNewDrugModal() {
            var modal = document.getElementById('newDrugModal');
            if (modal) {
                modal.style.display = 'none';
            }
            document.getElementById('newDrugSupplier').value = '';
            document.getElementById('newDrugInvoice').value = '';
            document.getElementById('newDrugReceivedBy').value = '';
            document.getElementById('newDrugNotes').value = '';
        }

        function addNewDrugRow() {
            var tbody = document.getElementById('newDrugTableBody');
            var row = document.createElement('tr');
            var index = newDrugRowCount;

            row.innerHTML = `
                <td style="padding:6px;border:1px solid #ddd;">
                    <input type="text" id="nd-name-${index}" placeholder="Drug name" style="width:100%;padding:4px 6px;border:1px solid #ccc;border-radius:3px;">
                </td>
                <td style="padding:6px;border:1px solid #ddd;">
                    <input type="text" id="nd-form-${index}" placeholder="Form" style="width:100%;padding:4px 6px;border:1px solid #ccc;border-radius:3px;">
                </td>
                <td style="padding:6px;border:1px solid #ddd;">
                    <input type="text" id="nd-batch-${index}" placeholder="Batch" style="width:100%;padding:4px 6px;border:1px solid #ccc;border-radius:3px;">
                </td>
                <td style="padding:6px;border:1px solid #ddd;">
                    <input type="date" id="nd-expiry-${index}" style="width:100%;padding:4px 6px;border:1px solid #ccc;border-radius:3px;">
                </td>
                <td style="padding:6px;border:1px solid #ddd;text-align:center;">
                    <input type="number" id="nd-qty-${index}" placeholder="Qty" min="1" value="1" style="width:100%;padding:4px 6px;border:1px solid #ccc;border-radius:3px;text-align:center;">
                </td>
                <td style="padding:6px;border:1px solid #ddd;text-align:center;">
                    <button onclick="removeDrugRow(this)" style="background:none;border:none;color:#c00;cursor:pointer;font-size:16px;">✕</button>
                </td>
            `;

            tbody.appendChild(row);
            newDrugRowCount++;

            setTimeout(function() {
                var firstInput = row.querySelector('input');
                if (firstInput) firstInput.focus();
            }, 100);
        }

        function removeDrugRow(button) {
            var row = button.closest('tr');
            if (row) {
                var tbody = document.getElementById('newDrugTableBody');
                if (tbody.children.length > 1) {
                    row.remove();
                } else {
                    if (typeof showAlert === 'function') showAlert('At least one row is required.', 'warning');
                }
            }
        }

        function removeLastDrugRow() {
            var tbody = document.getElementById('newDrugTableBody');
            if (tbody.children.length > 1) {
                tbody.removeChild(tbody.lastChild);
            } else {
                if (typeof showAlert === 'function') showAlert('At least one row is required.', 'warning');
            }
        }

        function setupNewDrugEnterNavigation() {
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    var target = e.target;
                    if (target && target.id && target.id.startsWith('nd-')) {
                        e.preventDefault();
                        var row = target.closest('tr');
                        if (row) {
                            var inputs = row.querySelectorAll('input');
                            var currentIndex = Array.from(inputs).indexOf(target);
                            if (currentIndex < inputs.length - 1) {
                                inputs[currentIndex + 1].focus();
                            } else {
                                addNewDrugRow();
                                var tbody = document.getElementById('newDrugTableBody');
                                var newRow = tbody.lastChild;
                                if (newRow) {
                                    var firstInput = newRow.querySelector('input');
                                    if (firstInput) firstInput.focus();
                                }
                            }
                        }
                    }
                }
            });
        }

        // ============================================================
        // SUBMIT NEW DRUGS (BULK)
        // ============================================================

       async function submitNewDrugs() {
            var tbody = document.getElementById('newDrugTableBody');
            var rows = tbody.querySelectorAll('tr');
        
            if (rows.length === 0) {
                if (typeof showAlert === 'function') showAlert('Please add at least one drug.', 'error');
                return;
            }
        
            var drugs = [];
            var hasError = false;
            var errorMessages = [];
        
            rows.forEach(function(row, index) {
                var name = row.querySelector('#nd-name-' + index) ? row.querySelector('#nd-name-' + index).value.trim() : '';
                var form = row.querySelector('#nd-form-' + index) ? row.querySelector('#nd-form-' + index).value.trim() : '';
                var batch = row.querySelector('#nd-batch-' + index) ? row.querySelector('#nd-batch-' + index).value.trim() : '';
                var expiry = row.querySelector('#nd-expiry-' + index) ? row.querySelector('#nd-expiry-' + index).value : '';
                var qty = row.querySelector('#nd-qty-' + index) ? parseInt(row.querySelector('#nd-qty-' + index).value) : 0;
        
                if (!name || !form || !batch || !expiry || !qty) {
                    errorMessages.push('Row ' + (index + 1) + ' has missing fields.');
                    hasError = true;
                    return;
                }
        
                if (qty < 1) {
                    errorMessages.push('Quantity for ' + name + ' must be at least 1.');
                    hasError = true;
                    return;
                }
        
                drugs.push({
                    drug: name,
                    form: form,
                    batch: batch,
                    expiry: expiry,
                    quantity: qty
                });
            });
        
            if (hasError) {
                if (typeof showAlert === 'function') showAlert(errorMessages.join(' '), 'error');
                return;
            }
        
            if (drugs.length === 0) {
                if (typeof showAlert === 'function') showAlert('No valid drugs to add.', 'error');
                return;
            }
        
            // ============================================================
            // CONFIRMATION POPUP
            // ============================================================
            if (!confirm('Add ' + drugs.length + ' new drug(s) to inventory?')) {
                return;
            }
        
            // ============================================================
            // SHOW LOADING OVERLAY
            // ============================================================
            var loadingOverlay = document.createElement('div');
            loadingOverlay.id = 'bulkLoadingOverlay';
            loadingOverlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(255,255,255,0.9);
                z-index: 999999;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: Arial, sans-serif;
            `;
            loadingOverlay.innerHTML = `
                <div style="text-align:center;background:#fff;padding:30px 40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.15);">
                    <div style="border:4px solid #f3f3f3;border-top:4px solid #38a169;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin:0 auto 15px;"></div>
                    <div style="font-size:18px;color:#333;font-weight:500;">Adding ${drugs.length} new drug(s)...</div>
                    <div style="font-size:13px;color:#888;margin-top:5px;">Please wait</div>
                </div>
            `;
            document.body.appendChild(loadingOverlay);
        
            var supplier = document.getElementById('newDrugSupplier').value.trim();
            var invoice = document.getElementById('newDrugInvoice').value.trim();
            var receivedBy = document.getElementById('newDrugReceivedBy').value.trim() || currentUser.username;
            var notes = document.getElementById('newDrugNotes').value.trim();
        
            var url = API_URL +
                '?action=addbulkdrugs' +
                '&admin=' + encodeURIComponent(currentUser.username) +
                '&supplier=' + encodeURIComponent(supplier || '') +
                '&invoice=' + encodeURIComponent(invoice || '') +
                '&receivedBy=' + encodeURIComponent(receivedBy) +
                '&notes=' + encodeURIComponent(notes || '') +
                '&drugs=' + encodeURIComponent(JSON.stringify(drugs));
        
            try {
                var response = await fetch(url);
                var result = await response.json();
        
                // ============================================================
                // REMOVE LOADING OVERLAY
                // ============================================================
                var overlay = document.getElementById('bulkLoadingOverlay');
                if (overlay) overlay.remove();
        
                if (result.success) {
                    // ============================================================
                    // SUCCESS MESSAGE
                    // ============================================================
                    if (typeof showAlert === 'function') {
                        showAlert('✅ ' + result.message, 'success');
                    }
        
                    // Clear modal fields
                    document.getElementById('newDrugSupplier').value = '';
                    document.getElementById('newDrugInvoice').value = '';
                    document.getElementById('newDrugReceivedBy').value = '';
                    document.getElementById('newDrugNotes').value = '';
        
                    // Clear table (keep one empty row)
                    var tbody = document.getElementById('newDrugTableBody');
                    tbody.innerHTML = '';
                    newDrugRowCount = 0;
                    addNewDrugRow();
        
                    // Refresh drug list
                    loadDrugsSilent();
                    if (isDrugListVisible) {
                        filteredDrugs = allDrugs;
                        renderDrugList();
                    }
        
                    // ============================================================
                    // CLOSE MODAL AFTER 1.5 SECONDS
                    // ============================================================
                    setTimeout(function() {
                        closeNewDrugModal();
                    }, 1500);
        
                    // ============================================================
                    // SHOW REFRESH LOADING AND RELOAD AFTER 2.5 SECONDS
                    // ============================================================
                    setTimeout(function() {
                        var refreshOverlay = document.createElement('div');
                        refreshOverlay.id = 'refreshOverlay';
                        refreshOverlay.style.cssText = `
                            position: fixed;
                            top: 0;
                            left: 0;
                            width: 100%;
                            height: 100%;
                            background: rgba(255,255,255,0.9);
                            z-index: 999999;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            font-family: Arial, sans-serif;
                        `;
                        refreshOverlay.innerHTML = `
                            <div style="text-align:center;background:#fff;padding:30px 40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.15);">
                                <div style="border:4px solid #f3f3f3;border-top:4px solid #2b6cb0;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin:0 auto 15px;"></div>
                                <div style="font-size:18px;color:#333;font-weight:500;">Refreshing page...</div>
                            </div>
                        `;
                        document.body.appendChild(refreshOverlay);
                        window.location.reload();
                    }, 2500);
        
                } else {
                    // ============================================================
                    // ERROR MESSAGE
                    // ============================================================
                    if (typeof showAlert === 'function') {
                        showAlert('❌ ' + (result.message || 'Error adding drugs.'), 'error');
                    }
                    if (result.errors && result.errors.length > 0) {
                        console.log('Errors:', result.errors);
                    }
                }
        
            } catch (error) {
                // ============================================================
                // ERROR - REMOVE LOADING
                // ============================================================
                var overlay = document.getElementById('bulkLoadingOverlay');
                if (overlay) overlay.remove();
        
                console.error('Error:', error);
                if (typeof showAlert === 'function') {
                    showAlert('❌ Error connecting to server. Please try again.', 'error');
                }
            }
        }
        // ============================================================
        // TOGGLE NEW RECEIVE
        // ============================================================

        function toggleNewReceive() {
            var panel = document.getElementById('receivePanel');
            var btn = document.getElementById('newReceiveBtn');

            if (isReceiveOpen) {
                if (receiveItems.length > 0) {
                    if (!confirm('You have items in this receive. Cancel?')) {
                        return;
                    }
                    receiveItems = [];
                }
                if (panel) panel.style.display = 'none';
                if (btn) btn.textContent = '➕ New Receive';
                isReceiveOpen = false;
                var receiveIdDisplay = document.getElementById('receiveIdDisplay');
                var receiveNotes = document.getElementById('receiveNotes');
                if (receiveIdDisplay) receiveIdDisplay.textContent = '';
                if (receiveNotes) receiveNotes.value = '';
                renderReceiveList();
            } else {
                if (panel) panel.style.display = 'block';
                if (btn) btn.textContent = '✕ Cancel Receive';
                isReceiveOpen = true;
                currentReceiveId = generateReceiveId();
                var receiveIdDisplay = document.getElementById('receiveIdDisplay');
                var receiveNotes = document.getElementById('receiveNotes');
                if (receiveIdDisplay) receiveIdDisplay.textContent = 'Receive: ' + currentReceiveId;
                if (receiveNotes) receiveNotes.value = '';
                renderReceiveList();
            }
        }

        // ============================================================
        // SHOW/HIDE DRUG LIST
        // ============================================================

        function toggleDrugList() {
            var panel = document.getElementById('drugListPanel');
            var container = document.getElementById('drugListContainer');
            var btn = document.getElementById('toggleDrugsBtn');
            var closeBtn = document.getElementById('closeDrugListBtn');

            if (isDrugListVisible) {
                if (panel) panel.style.display = 'none';
                if (btn) btn.textContent = 'Show All Drugs';
                if (closeBtn) closeBtn.style.display = 'none';
                isDrugListVisible = false;
                var drugSearch = document.getElementById('drugSearch');
                if (drugSearch) drugSearch.value = '';
            } else {
                if (allDrugs.length === 0) {
                    if (typeof showLoading === 'function') showLoading('Loading drugs...');
                    loadDrugsSilent().then(function() {
                        if (typeof hideLoading === 'function') hideLoading();
                        if (allDrugs.length === 0) {
                            if (container) container.innerHTML = '<p class="text-muted">No drugs found.</p>';
                            if (panel) panel.style.display = 'block';
                            if (btn) btn.textContent = 'Hide Drugs';
                            if (closeBtn) closeBtn.style.display = 'inline';
                            isDrugListVisible = true;
                        } else {
                            filteredDrugs = allDrugs;
                            currentPage = 1;
                            renderDrugList();
                            if (panel) panel.style.display = 'block';
                            if (btn) btn.textContent = 'Hide Drugs';
                            if (closeBtn) closeBtn.style.display = 'inline';
                            isDrugListVisible = true;
                        }
                    });
                    return;
                }

                filteredDrugs = allDrugs;
                currentPage = 1;
                renderDrugList();
                if (panel) panel.style.display = 'block';
                if (btn) btn.textContent = 'Hide Drugs';
                if (closeBtn) closeBtn.style.display = 'inline';
                isDrugListVisible = true;
            }
        }

        // ============================================================
        // CLOSE DRUG LIST
        // ============================================================

        function closeDrugList() {
            var panel = document.getElementById('drugListPanel');
            var btn = document.getElementById('toggleDrugsBtn');
            var closeBtn = document.getElementById('closeDrugListBtn');

            if (panel) panel.style.display = 'none';
            if (btn) btn.textContent = 'Show All Drugs';
            if (closeBtn) closeBtn.style.display = 'none';
            isDrugListVisible = false;
            var drugSearch = document.getElementById('drugSearch');
            if (drugSearch) drugSearch.value = '';
        }

        // ============================================================
        // LOAD DRUGS SILENTLY
        // ============================================================

        async function loadDrugsSilent() {
            try {
                var response = await fetch(API_URL + '?search=');
                var results = await response.json();

                allDrugs = results.map(function(item) {
                    return {
                        name: item[0] || 'Unknown',
                        form: item[1] || 'Unknown',
                        balance: parseFloat(item[2]) || 0
                    };
                });

                filteredDrugs = allDrugs;

            } catch (error) {
                console.error('Error loading drugs:', error);
            }
        }

        // ============================================================
        // SEARCH DRUGS
        // ============================================================

        function searchDrugs() {
            var query = document.getElementById('drugSearch').value.toLowerCase().trim();

            if (!query) {
                if (typeof showAlert === 'function') showAlert('Please enter a search term.', 'error');
                return;
            }

            var panel = document.getElementById('drugListPanel');
            var btn = document.getElementById('toggleDrugsBtn');
            var closeBtn = document.getElementById('closeDrugListBtn');

            if (!isDrugListVisible) {
                if (allDrugs.length === 0) {
                    if (typeof showLoading === 'function') showLoading('Loading drugs...');
                    loadDrugsSilent().then(function() {
                        if (typeof hideLoading === 'function') hideLoading();
                        performSearch(query);
                        if (panel) panel.style.display = 'block';
                        if (btn) btn.textContent = 'Hide Drugs';
                        if (closeBtn) closeBtn.style.display = 'inline';
                        isDrugListVisible = true;
                    });
                    return;
                }

                filteredDrugs = allDrugs;
                currentPage = 1;
                if (panel) panel.style.display = 'block';
                if (btn) btn.textContent = 'Hide Drugs';
                if (closeBtn) closeBtn.style.display = 'inline';
                isDrugListVisible = true;
                performSearch(query);
            } else {
                performSearch(query);
            }
        }

        function performSearch(query) {
            if (typeof showLoading === 'function') showLoading('Searching for: ' + query);

            setTimeout(function() {
                filteredDrugs = allDrugs.filter(function(drug) {
                    return drug.name.toLowerCase().indexOf(query) !== -1 ||
                           drug.form.toLowerCase().indexOf(query) !== -1;
                });

                currentPage = 1;
                if (typeof hideLoading === 'function') hideLoading();

                var container = document.getElementById('drugListContainer');
                var count = document.getElementById('drugCount');
                var pagination = document.getElementById('pagination');

                if (filteredDrugs.length === 0) {
                    if (container) container.innerHTML = '<p class="text-muted">No drugs found matching "' + query + '".</p>';
                    if (count) count.textContent = '0 drugs';
                    if (pagination) pagination.style.display = 'none';
                } else {
                    renderDrugList();
                }
            }, 300);
        }

        // ============================================================
        // CLEAR SEARCH
        // ============================================================

        function clearSearch() {
            var drugSearch = document.getElementById('drugSearch');
            if (drugSearch) drugSearch.value = '';

            if (isDrugListVisible) {
                renderDrugList();
            } else {
                var panel = document.getElementById('drugListPanel');
                var container = document.getElementById('drugListContainer');
                var count = document.getElementById('drugCount');
                var pagination = document.getElementById('pagination');

                if (panel) panel.style.display = 'none';
                if (container) container.innerHTML = '<p class="text-muted">Search for a drug or click "Show All Drugs".</p>';
                if (count) count.textContent = '';
                if (pagination) pagination.style.display = 'none';
            }

            if (drugSearch) drugSearch.focus();
            if (typeof showAlert === 'function') showAlert('Search cleared.', 'info');
        }

        // ============================================================
        // RENDER DRUG LIST
        // ============================================================

        function renderDrugList() {
            var container = document.getElementById('drugListContainer');
            var count = document.getElementById('drugCount');
            var pagination = document.getElementById('pagination');
            var pageInfo = document.getElementById('pageInfo');

            if (!filteredDrugs || filteredDrugs.length === 0) {
                if (container) container.innerHTML = '<p class="text-muted">No drugs found.</p>';
                if (count) count.textContent = '0 drugs';
                if (pagination) pagination.style.display = 'none';
                return;
            }

            var totalPages = Math.ceil(filteredDrugs.length / pageSize);
            var start = (currentPage - 1) * pageSize;
            var end = Math.min(start + pageSize, filteredDrugs.length);
            var pageDrugs = filteredDrugs.slice(start, end);

            if (count) count.textContent = filteredDrugs.length + ' drugs';

            if (filteredDrugs.length > pageSize) {
                if (pageInfo) pageInfo.textContent = 'Page ' + currentPage + ' of ' + totalPages;
                if (pagination) pagination.style.display = 'flex';
            } else {
                if (pagination) pagination.style.display = 'none';
            }

            var html = '<table>';
            html += '<tr><th>Drug Name</th><th>Form</th><th>Balance</th><th>Receive Qty</th><th>Action</th></tr>';

            pageDrugs.forEach(function(drug, index) {
                var globalIndex = start + index;
                var inReceive = receiveItems.some(function(item) { return item.name === drug.name; });
                var safeId = 'rqty-' + globalIndex;

                html += '<tr>';
                html += '<td><strong>' + drug.name + '</strong></td>';
                html += '<td>' + drug.form + '</td>';
                html += '<td>' + drug.balance + '</td>';
                html += '<td>';
                html += '<input type="number" id="' + safeId + '" ';
                html += 'min="1" value="1" style="width:70px;padding:4px 6px;border:1px solid #ccc;text-align:center;">';
                html += '</td>';
                html += '<td>';
                if (inReceive) {
                    html += '<span style="color:#0a0;">✅ Added</span>';
                } else {
                    html += '<button class="btn btn-small" onclick="addToReceive(\'' + drug.name.replace(/'/g, "\\'") + '\',' + drug.balance + ',' + globalIndex + ')">Add</button>';
                }
                html += '</td>';
                html += '</tr>';
            });

            html += '</table>';
            if (container) container.innerHTML = html;
        }

        // ============================================================
        // PAGINATION
        // ============================================================

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderDrugList();
            }
        }

        function nextPage() {
            var totalPages = Math.ceil(filteredDrugs.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderDrugList();
            }
        }

        // ============================================================
        // ADD TO RECEIVE
        // ============================================================

        function addToReceive(drugName, maxStock, index) {
            var qtyInput = document.getElementById('rqty-' + index);
            if (!qtyInput) {
                if (typeof showAlert === 'function') showAlert('Error: Could not find quantity input.', 'error');
                return;
            }

            var qty = parseInt(qtyInput.value) || 1;

            if (qty < 1) {
                if (typeof showAlert === 'function') showAlert('Quantity must be at least 1.', 'error');
                return;
            }

            if (receiveItems.some(function(item) { return item.name === drugName; })) {
                if (typeof showAlert === 'function') showAlert(drugName + ' is already in this receive.', 'warning');
                return;
            }

            if (!isReceiveOpen) {
                var panel = document.getElementById('receivePanel');
                var btn = document.getElementById('newReceiveBtn');

                if (panel) panel.style.display = 'block';
                if (btn) btn.textContent = '✕ Cancel Receive';
                isReceiveOpen = true;
                currentReceiveId = generateReceiveId();
                var receiveIdDisplay = document.getElementById('receiveIdDisplay');
                var receiveNotes = document.getElementById('receiveNotes');
                if (receiveIdDisplay) receiveIdDisplay.textContent = 'Receive: ' + currentReceiveId;
                if (receiveNotes) receiveNotes.value = '';
            }

            receiveItems.push({
                name: drugName,
                quantity: qty
            });

            renderReceiveList();
            renderDrugList();
            if (typeof showAlert === 'function') showAlert('Added ' + drugName + ' to receive.', 'success');
        }

        // ============================================================
        // RENDER RECEIVE LIST
        // ============================================================

        function renderReceiveList() {
            var container = document.getElementById('receiveListContainer');

            if (!container) return;

            if (receiveItems.length === 0) {
                container.innerHTML = '<p class="text-muted">No items added yet. Search and add drugs.</p>';
                return;
            }

            var html = '<table style="width:100%;">';
            html += '<tr><th>Drug</th><th>Qty</th><th>Action</th></tr>';

            receiveItems.forEach(function(item, index) {
                html += '<tr>';
                html += '<td><strong>' + item.name + '</strong></td>';
                html += '<td>';
                html += '<input type="number" id="receive-qty-' + index + '" value="' + item.quantity + '" ';
                html += 'min="1" style="width:55px;padding:4px 6px;border:1px solid #ccc;text-align:center;" ';
                html += 'onchange="updateReceiveQty(' + index + ', this.value)">';
                html += '</td>';
                html += '<td><button class="btn btn-small" onclick="removeFromReceive(' + index + ')" style="color:#c00;">✕</button></td>';
                html += '</tr>';
            });

            html += '</table>';
            container.innerHTML = html;
        }

        // ============================================================
        // UPDATE RECEIVE QUANTITY
        // ============================================================

        function updateReceiveQty(index, newValue) {
            var qty = parseInt(newValue) || 1;

            if (qty < 1) {
                if (typeof showAlert === 'function') showAlert('Quantity must be at least 1.', 'error');
                qty = 1;
            }

            receiveItems[index].quantity = qty;
            renderReceiveList();
        }

        // ============================================================
        // REMOVE FROM RECEIVE
        // ============================================================

        function removeFromReceive(index) {
            var removed = receiveItems[index].name;
            receiveItems.splice(index, 1);
            renderReceiveList();
            if (isDrugListVisible) renderDrugList();
            if (typeof showAlert === 'function') showAlert('Removed ' + removed + ' from receive.', 'info');
        }

        // ============================================================
        // CLEAR RECEIVE
        // ============================================================

        function clearReceive() {
            if (receiveItems.length === 0) {
                if (typeof showAlert === 'function') showAlert('Receive is already empty.', 'info');
                return;
            }

            if (!confirm('Clear all items from this receive?')) return;

            receiveItems = [];
            var receiveNotes = document.getElementById('receiveNotes');
            if (receiveNotes) receiveNotes.value = '';
            renderReceiveList();
            if (isDrugListVisible) renderDrugList();
            if (typeof showAlert === 'function') showAlert('Receive cleared.', 'info');
        }

        // ============================================================
        // SUBMIT RECEIVE
        // ============================================================

        function submitReceive() {
            if (receiveItems.length === 0) {
                if (typeof showAlert === 'function') showAlert('Please add at least one item to receive.', 'warning');
                return;
            }

            if (!confirm('Submit this receive? This will add stock to inventory.')) return;

            if (typeof showLoading === 'function') showLoading('Submitting receive...');

            var supplier = document.getElementById('receiveSupplier') ? document.getElementById('receiveSupplier').value.trim() : '';
            var invoice = document.getElementById('receiveInvoice') ? document.getElementById('receiveInvoice').value.trim() : '';
            var notes = document.getElementById('receiveNotes') ? document.getElementById('receiveNotes').value.trim() : '';

            var receiveData = {
                action: 'submitreceive',
                admin: currentUser.username,
                items: receiveItems.map(function(item) {
                    return {
                        drug: item.name,
                        quantity: item.quantity
                    };
                }),
                receiveId: currentReceiveId,
                supplier: supplier,
                invoice: invoice,
                notes: notes,
                timestamp: new Date().toISOString()
            };

            var url = API_URL +
                '?action=submitreceive' +
                '&admin=' + encodeURIComponent(receiveData.admin) +
                '&receiveId=' + encodeURIComponent(receiveData.receiveId) +
                '&items=' + encodeURIComponent(JSON.stringify(receiveData.items)) +
                '&supplier=' + encodeURIComponent(receiveData.supplier) +
                '&invoice=' + encodeURIComponent(receiveData.invoice) +
                '&notes=' + encodeURIComponent(receiveData.notes) +
                '&timestamp=' + encodeURIComponent(receiveData.timestamp);

            fetch(url)
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (typeof hideLoading === 'function') hideLoading();
                if (result.success) {
                    if (typeof showAlert === 'function') showAlert('✅ Receive completed successfully! Stock added. Refreshing...', 'success');

                    receiveItems = [];
                    var receiveNotes = document.getElementById('receiveNotes');
                    if (receiveNotes) receiveNotes.value = '';
                    var receiveSupplier = document.getElementById('receiveSupplier');
                    var receiveInvoice = document.getElementById('receiveInvoice');
                    if (receiveSupplier) receiveSupplier.value = '';
                    if (receiveInvoice) receiveInvoice.value = '';
                    renderReceiveList();
                    if (isDrugListVisible) renderDrugList();

                    currentReceiveId = generateReceiveId();
                    var receiveIdDisplay = document.getElementById('receiveIdDisplay');
                    if (receiveIdDisplay) receiveIdDisplay.textContent = 'Receive: ' + currentReceiveId;

                    setTimeout(function() {
                        window.location.reload();
                    }, 1500);
                } else {
                    if (typeof showAlert === 'function') showAlert(result.message || 'Error submitting receive.', 'error');
                }
            })
            .catch(function(error) {
                if (typeof hideLoading === 'function') hideLoading();
                console.error('Error:', error);
                if (typeof showAlert === 'function') showAlert('Error connecting to server.', 'error');
            });
        }

        // ============================================================
        // INITIALIZE NEW DRUG MODAL ENTER KEY
        // ============================================================

        document.addEventListener('DOMContentLoaded', function() {
            setupNewDrugEnterNavigation();
        });
    </script>
